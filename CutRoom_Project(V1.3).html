const Grading = {
  /* ----- .cube LUT parsing ----- */
  lutCache(lut){
    const key = lut.id + "|" + lut.name;
    if (this._lk === key) return this._lut;
    this._lk = key; this._lut = null;
    if (lut.grid && lut.table){
      const n = lut.grid, T = lut.table, m1 = n - 1;
      const idx = (r, g2, b) => ((r * n + g2) * n + b) * 3;
      this._lut = (fx, R, G, B) => {
        const rf = R / 255 * m1, gf = G / 255 * m1, bf = B / 255 * m1;
        const r0 = Math.min(m1, Math.floor(rf)), g0 = Math.min(m1, Math.floor(gf)), b0 = Math.min(m1, Math.floor(bf));
        const r1 = Math.min(m1, r0 + 1), g1 = Math.min(m1, g0 + 1), b1 = Math.min(m1, b0 + 1);
        const dr = rf - r0, dg = gf - g0, db = bf - b0, out = [0, 0, 0];
        for (let ch = 0; ch < 3; ch++){
          const c000 = T[idx(r0, g0, b0) + ch], c100 = T[idx(r1, g0, b0) + ch], c010 = T[idx(r0, g1, b0) + ch], c110 = T[idx(r1, g1, b0) + ch];
          const c001 = T[idx(r0, g0, b1) + ch], c101 = T[idx(r1, g0, b1) + ch], c011 = T[idx(r0, g1, b1) + ch], c111 = T[idx(r1, g1, b1) + ch];
          const c00 = c000 + (c100 - c000) * dr, c10 = c010 + (c110 - c010) * dr, c01 = c001 + (c101 - c001) * dr, c11 = c011 + (c111 - c011) * dr;
          const c0v = c00 + (c10 - c00) * dg, c1v = c01 + (c11 - c01) * dg;
          out[ch] = c0v + (c1v - c0v) * db;
        }
        return out;
      };
    }
    return this._lut;
  },
  async importLUT(){
    const f = Ed.findClip(editorState.selectedClip);
    if (!f || Ed.isOv(f.c)) return UI.toast("Select a video or image clip first — LUTs attach to the clip's color pipeline.", "warn");
    const i = Object.assign(document.createElement("input"), { type: "file", accept: ".cube,.3dl,text/plain" });
    i.onchange = async () => {
      const file = i.files[0]; if (!file) return;
      try {
        const text = await file.text(), lut = this.parseCube(text, file.name);
        Hist.run("Import LUT", () => { const F = ClipProps.ensureF(f.c); F.lut = lut; });
        UI.toast(`LUT "${file.name}" applied (${lut.grid}³ grid).`);
      } catch (e){ UI.toast("Couldn't read that LUT: " + e.message, "error"); }
    };

  parseCube(text, name){

      line = line.trim(); if (!line || line.startsWith("#")) continue;
      const toks = line.split(/\s+/);
      if (toks[0].toUpperCase() === "LUT_3D_SIZE"){ size = +toks[1]; continue; }
      if (toks[0].toUpperCase() === "TITLE" || toks[0].toUpperCase() === "DOMAIN_" || toks[0].toUpperCase() === "LUT_1D_SIZE") continue;
      if (toks.length >= 3 && !isNaN(+toks[0])) table.push(+toks[0], +toks[1], +toks[2]);

    if (!size || table.length < size * size * size * 3) throw new Error("not a supported 3D .cube LUT");

  exportLUT(){
    const f = Ed.findClip(editorState.selectedClip);

    const F = f.c.filters || Fx.DEF_FILTERS, N = 17;
    /* render a color grid through the clip's pipeline (canvas filter + colorPost + curve) and read it back */
    const cell = 8, cols = N * N, cv = document.createElement("canvas");
    cv.width = cols * cell; cv.height = N * cell;
    const g = cv.getContext("2d", { willReadFrequently: true });
    for (let b = 0; b < N; b++) for (let gr = 0; gr < N; gr++) for (let r = 0; r < N; r++){
      const x = (b * N + gr) * cell, y = r * cell;

    g.fillStyle = "#E8B04A";
    for (const k of arr){ const x = k.t / end * cv.width, y = cv.height - 14 - (k.v - mn) / (mx - mn || 1) * (cv.height - 26);

    g.fillStyle = "#5C6474"; g.font = "10px monospace";
    g.fillText(`${Kf.PROPS[prop]?.label || prop} · 0 → ${end.toFixed(2)}s · ${mn.toFixed(2)} → ${mx.toFixed(2)}`, 6, 12);
    slot.append(cv);
  }
};
/* ---------- Stage 6 : AudioFX — normalization, LUFS, loudness matching, ducking, beats, silence tools, A/V sync, quality ---------- */
const AudioFX = {
  /* ----- live integrated LUFS meter (BS.1770 approximation: K-weighting + 400 ms blocks + relative gate) ----- */
  lufs: { blocks: [], current: -70, K: null },
  kWeight(){
    if (this.lufs.K) return this.lufs.K;
    const ctx = Sound.ready(); if (!ctx) return null;
    const hs = ctx.createBiquadFilter(), hp = ctx.createBiquadFilter(), ana = ctx.createAnalyser();
    hs.type = "highshelf"; hs.frequency.value = 1500; hs.gain.value = 4;             // Stage-2 pre-filter (approx)
    hp.type = "highpass"; hp.frequency.value = 38; hp.Q.value = .5;                  // RLB weighting (approx)
    ana.fftSize = 2048;
    /* pure dead-end tap — never rewires the output path (keeps export taps intact) */
    Sound.master.connect(hs); hs.connect(hp); hp.connect(ana);
    this.lufs.K = ana;
    return ana;
  },
  lufsTick(){
    const ana = this.kWeight(); if (!ana || !Play.playing) return;
    const b = this._lufsBuf ||= new Float32Array(ana.fftSize);
    ana.getFloatTimeDomainData(b);
    let ms = 0; for (let i = 0; i < b.length; i++) ms += b[i] * b[i];
    ms /= b.length;
    const L = this.lufs;
    L.blocks.push(ms); if (L.blocks.length > 4000) L.blocks.shift();                  // rolling window (~4 min)
    const cur = -0.691 + 10 * Math.log10(ms + 1e-12);
    L.current = cur < -70 ? -70 : cur;
    /* gated integrated loudness: absolute -70 LUFS gate then relative -10 LU gate */
    const abs = L.blocks.filter(v => -0.691 + 10 * Math.log10(v + 1e-12) > -70);
    if (abs.length > 4){
      const mean1 = abs.reduce((a, v) => a + v, 0) / abs.length;
      const rel = abs.filter(v => -0.691 + 10 * Math.log10(v + 1e-12) > -0.691 + 10 * Math.log10(mean1) - 10);
      if (rel.length > 2){
        const mean2 = rel.reduce((a, v) => a + v, 0) / rel.length;
        L.integrated = -0.691 + 10 * Math.log10(mean2);
      }
    }
    const el = document.getElementById("lufsRead");
    if (el) el.textContent = `${L.current.toFixed(1)} LUFS-S${L.integrated ? " · " + L.integrated.toFixed(1) + " LUFS-I" : ""}`;
  },
  lufsReset(){ this.lufs.blocks = []; this.lufs.integrated = null; },
  /* ----- ducking: music beds (tracks marked "music") duck while voice clips play ----- */
  duckFrame(active){
    const voiceActive = active.some(({ c, k }) => k.duck === "voice" || (!k.duck && !k.overlay && k.kind === "audio" && c.mediaId && !c.muted));
    for (const k of editorState.tracks){
      if (k.duck !== "music") continue;
      for (const c of k.clips){
        const ch = Sound.chains.get(c.id); if (!ch) continue;
        const amt = Fx.clamp(editorState.project.duckAmount ?? .18, .02, 1);
        ch.duck.gain.setTargetAtTime(voiceActive ? amt : 1, Sound.ctx.currentTime, voiceActive ? .25 : .6);

    }

  /* ----- offline analysis helpers ----- */

  },
  kLoudnessOf(buf){                                          // gated K-weighted loudness of a decoded buffer (LUFS)

    const src = off.createBufferSource(); src.buffer = buf;
    const hs = off.createBiquadFilter(); hs.type = "highshelf"; hs.frequency.value = 1500; hs.gain.value = 4;
    const hp = off.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 38; hp.Q.value = .5;

      const abs = blocks.filter(v => Z(v) > -70);
      if (!abs.length) return -70;
      const m1 = abs.reduce((a, v) => a + v, 0) / abs.length;
      const rel = abs.filter(v => Z(v) > Z(m1) - 10);

  },
  /* audio normalization — peak or loudness target written into the clip gain */
  async normalize(clip, mode){
    const m = editorState.media.find(x => x.id === clip.mediaId);
    if (!m || m.kind === "image") return UI.toast("Normalization works on audio and video clips.", "warn");
    try {
      const buf = await this.decode(m);
      const seg = buf.getChannelData(0), from = Math.floor((clip.in || 0) * buf.sampleRate), to = Math.min(seg.length, Math.floor((clip.out || m.duration) * buf.sampleRate));
      let peak = 0, sum = 0, n = 0;
      for (let i = from; i < to; i += 2){ const v = Math.abs(seg[i]); if (v > peak) peak = v; sum += v * v; n++; }

      const targetDb = mode === "loud" ? -16 : -1;
      const cur = mode === "loud" ? 20 * Math.log10(rms + 1e-9) : 20 * Math.log10(peak + 1e-9);
      const gain = Fx.clamp(Math.pow(10, (targetDb - cur) / 20), .05, 12);
      Hist.run("Normalize audio", () => clip.volume = +gain.toFixed(3));
      Sound.applyClip(clip);
      UI.toast(`Normalized ${mode === "loud" ? "loudness (RMS)" : "peak"} to ${targetDb} dBFS — clip volume ×${gain.toFixed(2)}.`);

  },
  /* automatic loudness matching — measure every audio clip, then set gains toward one target */
  async matchLoudness(target = -16){
    const clips = editorState.tracks.flatMap(k => k.clips).filter(c => c.mediaId).filter(c => editorState.media.find(x => x.id === c.mediaId)?.kind !== "image");
    if (clips.length < 2) return UI.toast("Add at least two audio/video clips to match.", "warn");
    UI.toast(`Measuring ${clips.length} clips…`, "info", 4000);
    const done = [];
    for (const c of clips){
      try { const m = editorState.media.find(x => x.id === c.mediaId); done.push({ c, lufs: await this.kLoudnessOf(await this.decode(m)) }); }

  },
  /* ----- beat / BPM detection (onset envelope + autocorrelation) ----- */
  beats: new Map(),                                          // mediaId → { bpm, offset, beats[] }
  async analyzeBeats(m){
    try {
      const buf = await this.decode(m);
      const d = buf.getChannelData(0), sr = buf.sampleRate, win = Math.floor(sr * .01);

      const flux = env.map((v, i) => Math.max(0, v - (env[i - 1] || 0)));

        s /= flux.length - lag;
        if (s > best.score) best = { score: s, lag };
      }
      if (!best.lag) return UI.toast("Couldn't find a steady beat.", "warn");
      const bpm = Math.round(fps * 60 / best.lag * 10) / 10;
      let bi = flux.indexOf(Math.max(...flux.slice(0, best.lag)));
      const beats = []; for (let t = bi / fps; t < m.duration; t += 60 / bpm) beats.push(+t.toFixed(3));
      this.beats.set(m.id, { bpm, offset: bi / fps, beats });
      UI.toast(`${m.name}: ${bpm} BPM detected (${beats.length} beats).`);
      return this.beats.get(m.id);
    } catch (e){ UI.toast("Beat analysis failed: " + e.message, "error"); }
  },
  /* automatic music synchronization — snap a music clip so its first downbeat lands on the nearest timeline edit point */
  syncMusic(){
    const f = Ed.findClip(editorState.selectedClip);
    const m = f && editorState.media.find(x => x.id === f.c.mediaId);
    if (!f || !m || m.kind !== "audio") return UI.toast("Select a music (audio) clip first.", "warn");
    const b = this.beats.get(m.id) || null;
    if (!b) return UI.toast("Analyze the beat grid first (Audio panel → Analyze BPM).", "warn");
    const edits = Edits.editPoints();
    if (edits.length < 2) return UI.toast("No edit points to sync to.", "warn");
    const firstBeat = b.beats[0] ?? 0, period = 60 / b.bpm;
    /* candidate clip starts: every edit point minus a whole number of beats */
    let best = null;

    Bus.emit("state:changed");
    UI.toast(`Music aligned — first downbeat lands at ${fmtDur(f.c.start)} (nearest edit ${fmtDur(edits.reduce((a, x) => Math.abs(x - best.start) < Math.abs(a - best.start) ? x : a, edits[0]))}).`);

  /* ----- silence detection (offline scan over the clip's own audio) ----- */
  silences: new Map(),                                       // mediaId → [{from,to}]
  async detectSilences(m, thDb = -40, minS = .5){

      if (start !== null && d.length - start >= minN) out.push({ from: start / sr, to: d.length / sr });

  },
  /* automatic silence removal — split the clip around silences and drop the silent parts */
  async removeSilences(){

    if (!f || !m || m.kind === "image") return UI.toast("Select an audio or video clip first.", "warn");

      .map(([a, b]) => [Math.max(a, f.c.in || 0), Math.min(b, f.c.out ?? m.duration)]);

      const k = f.k; let src = f.c; const made = [];

      }
      if (cursor < end - .05){ const piece = Ed.cloneClip(src); piece.in = cursor; piece.out = end; made.push(piece); }

  },
  /* ----- audio/video synchronization by waveform cross-correlation ----- */
  async syncAV(){
    const f = Ed.findClip(editorState.selectedClip);
    const m = f && editorState.media.find(x => x.id === f.c.mediaId);
    if (!f || !m || m.kind === "image") return UI.toast("Select the clip to move (audio or video).", "warn");
    const others = editorState.tracks.flatMap(k => k.clips).filter(c => c !== f.c && c.mediaId && !Ed.isOv(c));
    if (!others.length) return UI.toast("There is no other clip to sync against.", "warn");
    const ref = others[others.length - 1];
    const refM = editorState.media.find(x => x.id === ref.mediaId);
    try {
      const a = await this.decode(m), b = await this.decode(refM);
      const ds = 8000, N = 30 * ds;                            // compare the first 30 s, downsampled to 8 kHz
      const sig = (buf, off) => { const d = buf.getChannelData(0), out = new Float32Array(N);
        const stp = buf.sampleRate / ds; for (let i = 0; i < N; i++) out[i] = d[Math.min(d.length - 1, Math.floor(i * stp + off * buf.sampleRate))]; return out; };
      const A = sig(a, f.c.in || 0), B = sig(b, ref.in || 0);
      let best = { score: -Infinity, lag: 0 };
      for (let lag = -3 * ds; lag <= 3 * ds; lag += 40){       // ±3 s coarse
        let s = 0, n = 0;
        for (let i = 0; i < N; i += 8){ const j = i + lag; if (j >= 0 && j < N){ s += A[i] * B[j]; n++; } }
        s /= n || 1;
        if (s > best.score) best = { score: s, lag };
      }
      let fine = best.lag;
      for (let lag = best.lag - 40; lag <= best.lag + 40; lag += 4){
        let s = 0, n = 0;
        for (let i = 0; i < N; i += 4){ const j = i + lag; if (j >= 0 && j < N){ s += A[i] * B[j]; n++; } }
        s /= n || 1;
        if (s > best.score){ best = { score: s, lag }; fine = lag; }
      }
      const offset = -(fine / ds);
      if (Math.abs(offset) < .005) return UI.toast("These clips already appear to be in sync.");
      Hist.run("A/V sync", () => { f.c.start = Math.max(0, f.c.start + offset); });
      Bus.emit("state:changed");
      UI.toast(`A/V sync: moved the clip ${offset > 0 ? "later" : "earlier"} by ${Math.abs(offset).toFixed(3)}s (correlation peak).`);
    } catch (e){ UI.toast("A/V sync failed: " + e.message, "error"); }
  },
  /* ----- audio quality analysis — SNR estimate + verdict, shown in the media Info dialog ----- */
  quality(m){
    const i = m.info || {};
    if (i.peakDb === undefined) return null;
    const snr = Math.max(0, i.peakDb - (i.noiseDb ?? (i.rmsDb - 30)));
    const score = Math.max(0, Math.min(100, Math.round(60 + snr * .5 - (i.clipPct > .05 ? 25 : 0) - (i.silentPct > 60 ? 15 : 0))));
    const label = score >= 75 ? "Good" : score >= 50 ? "Fair" : "Poor";
    return { snr: +snr.toFixed(1), score, label };
  }
};
/* ---------- Stage 8 : Versions — project version history, snapshots, comparison, restore, branching, backup ---------- */
const Versions = {

      const t = db.transaction("versions", mode), rq = fn(t.objectStore("versions"));

  async remove(id){ return this.vtx("readwrite", st => st.delete(id)); },
  async snapshot(name, auto){
    if (!editorState.project.id) await Projects.save().catch(() => {});

      name: name || `Auto snapshot ${new Date().toLocaleString()}`, auto: !!auto, ts: Date.now(),
      data: Projects.serialize(), thumb: (() => { try { const c = document.createElement("canvas"); c.width = 160; c.height = 90; c.getContext("2d").drawImage(Video.cv, 0, 0, 160, 90); return c.toDataURL("image/jpeg", .6); } catch { return null; } })(),
      activity: (editorState.project.activity || []).slice(-30) };

  async autoSnap(){
    if (!Projects.dirty || Projects.suppress || !editorState.project.id) return;
    const list = await this.list(editorState.project.id);
    const lastAuto = list.find(v => v.auto);
    if (lastAuto && Date.now() - lastAuto.ts < 10 * 60 * 1000) return;      // at most one auto snapshot per 10 minutes
    if (!JSON.stringify(editorState.tracks).length) return;

  async restore(id, asNew){
    const v = await this.vtx("readonly", st => st.get(id));

      name: asNew ? (editorState.project.name + " — from " + v.name) : editorState.project.name,
      modified: Date.now(), created: Date.now(), data: JSON.parse(JSON.stringify(v.data)) };

  },
  async compare(id){

    lines.push(`Clips: ${oc.length} → ${cc.length} (${cc.length - oc.length >= 0 ? "+" : ""}${cc.length - oc.length})`);
    const om = old.media?.length || 0, cm = cur.media?.length || 0;

    const durNew = Ed.duration();

    const added = cc.filter(c => !olds.has(c.id)).length, removed = oc.filter(c => !news.has(c.id)).length;
    lines.push(`Added clips: ${added} · removed clips: ${removed}`);
    const d = this.cdlg ||= Object.assign(document.createElement("dialog"), { id: "dlg-version-cmp" }); if (!d.isConnected) document.body.append(d);
    d.innerHTML = `<header>Compare — ${v.name.replace(/</g, "&lt;")} vs current <button class="icon" data-close aria-label="Close">✕</button></header>
      <div class="body"><table class="lut">${lines.map(l => `<tr><td>${l}</td></tr>`).join("")}</table>

/* ---------- Stage 8 : Integrity — project integrity checker + backup / archive helpers ---------- */
const Integrity = {
  async check(){
    const issues = [];
    for (const c of Edits.conflicts()) issues.push({ kind: "timeline", msg: c.msg, fix: null, t: c.t, id: c.id });
    for (const m of editorState.media){
      if (Intel.isOffline(m)) issues.push({ kind: "media", msg: `"${m.name}" is offline — relink it.`, fix: "relink", id: m.id });
      else if (m.idx === "failed") issues.push({ kind: "media", msg: `"${m.name}" failed indexing — re-analyze it.`, fix: "reanalyze", id: m.id });
      if (m.kind !== "image" && m.duration && m.width && m.height && (m.width > 7680 || m.height > 7680)) issues.push({ kind: "media", msg: `"${m.name}" is extremely large for browser playback.`, fix: null });
    }
    const orphan = editorState.tracks.filter(k => !k.overlay && !k.clips.length).length;
    if (orphan) issues.push({ kind: "structure", msg: `${orphan} empty track${orphan > 1 ? "s" : ""} — consider deleting them.`, fix: null });
    try { const est = await navigator.storage?.estimate?.(); if (est?.usage > 1.5e9) issues.push({ kind: "storage", msg: `Browser storage usage is high (${fmtBytes(est.usage)}). Export a project file and clear old projects.`, fix: null }); } catch {}
    return issues;
  },
  async dialog(){
    const issues = await this.check();
    const d = this.dlg ||= Object.assign(document.createElement("dialog"), { id: "dlg-integrity" }); if (!d.isConnected) document.body.append(d);
    d.innerHTML = `<header>Project integrity — ${issues.length ? issues.length + " finding" + (issues.length > 1 ? "s" : "") : "all clear"} <button class="icon" data-close aria-label="Close">✕</button></header>
      <div class="body" style="max-height:60vh;overflow:auto">${issues.length ? `<table class="lut">${issues.map((x, i) => `<tr><td class="muted" width="80">${x.kind}</td><td>${x.msg.replace(/</g, "&lt;")}</td></tr>`).join("")}</table>`
        : '<p class="muted">No problems found — media is online, the timeline has no conflicts, and storage is healthy.</p>'}
      <div class="fpair"><button id="inBackup">Download backup (.cutroom.json)</button><button id="inArchive">Download archive (with versions)</button></div></div>
      <footer><button data-close>Close</button></footer>`;
    d.onclick = e => { if (e.target.closest("[data-close]")) d.close(); };
    d.querySelector("#inBackup").onclick = () => { d.close(); Projects.exportFile().catch(err => UI.toast("Backup failed: " + err.message, "error")); };
    d.querySelector("#inArchive").onclick = () => { d.close(); Projects.exportFile({ archive: true }).catch(err => UI.toast("Archive failed: " + err.message, "error")); };
    if (!d.open) d.showModal();
  }
};

{ const load = Video.load.bind(Video); Video.load = i => { setMode("source"); load(i); }; }
