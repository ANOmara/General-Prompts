<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutroom — Browser Video Editor</title>
<!--
  SCAFFOLD CONVENTIONS
  Every empty region is a SLOT:  <div data-slot="id" data-stage="N" data-el="what goes here">
  - data-slot : unique id. Your code mounts into it:  UI.slot('media-grid').append(...)
  - data-stage: build stage from the spec (1..10)
  - data-el   : the element(s) to insert
  Run  UI.listSlots()  in the console for the full table. Toggle outlines with the "Slots" button (Settings).
  Static shell controls use data-action="name" and are routed to UI.actions[name] (stubs for now).
-->
<style>
:root{
  --bg:#0F1115; --panel:#171A21; --panel2:#1E222B; --panel3:#262B36;
  --line:#2A2F3A; --line2:#353B49;
  --text:#E8EAF0; --muted:#8A92A3; --faint:#5C6474;
  --accent:#38C8D8; --accent-ink:#06191C; --danger:#F0616D; --warn:#E8B04A; --ok:#5CCB8A;
  --r:4px; --topbar:44px; --transport:40px; --status:24px;
  --left:320px; --right:300px; --timeline:300px;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 var(--font)}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer}
button:hover{background:var(--panel3)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.icon{width:30px;height:30px;padding:0;display:inline-grid;place-items:center}
button[aria-pressed="true"],button.active{background:var(--panel3);border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}

/* ---------- App grid ---------- */
#app{display:grid;height:100%;
  grid-template-columns:var(--left) minmax(0,1fr) var(--right);
  grid-template-rows:var(--topbar) minmax(0,1fr) var(--transport) var(--timeline) var(--status);
  grid-template-areas:"top top top" "left preview right" "left transport right" "timeline timeline timeline" "status status status"}
#topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#topbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#topbar .spacer{flex:1}
.logo{font-weight:700;letter-spacing:.02em;margin-right:6px}
#projectName{width:200px;background:transparent;border-color:transparent;text-align:center}
#projectName:hover,#projectName:focus{border-color:var(--line2);background:var(--bg)}

#left{grid-area:left;display:flex;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#rail{display:flex;flex-direction:column;width:68px;background:var(--bg);border-right:1px solid var(--line);overflow-y:auto}
#rail button{border:0;border-radius:0;background:none;padding:10px 4px;font-size:11px;color:var(--muted);border-left:2px solid transparent}
#rail button[aria-selected="true"]{color:var(--text);background:var(--panel);border-left-color:var(--accent)}
#panels{flex:1;min-width:0;overflow-y:auto}
.panel{display:none;padding:10px;gap:10px;flex-direction:column}
.panel.active{display:flex}
.panel h3{font-size:12px;font-weight:600;color:var(--muted)}

#previewWrap{grid-area:preview;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
#previewTools{display:flex;gap:6px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line)}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:12px;overflow:hidden}
#canvasBox{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;background:#000;box-shadow:0 0 0 1px var(--line2)}
#previewCanvas,#overlayLayer{position:absolute;inset:0;width:100%;height:100%}
#overlayLayer{pointer-events:none}

#transport{grid-area:transport;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#transport .spacer{flex:1}
.timecode{font-family:var(--mono);font-size:14px;min-width:150px}

#right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#propTabs{display:flex;border-bottom:1px solid var(--line)}
#propTabs button{flex:1;border:0;border-radius:0;background:none;color:var(--muted);padding:9px 2px;border-bottom:2px solid transparent}
#propTabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
#propBody{flex:1;overflow-y:auto;padding:10px}
.propPane{display:none;flex-direction:column;gap:10px}
.propPane.active{display:flex}
#propEmpty{color:var(--muted);text-align:center;padding:24px 8px}

#timeline{grid-area:timeline;display:grid;grid-template-columns:180px minmax(0,1fr);grid-template-rows:34px 30px 24px minmax(0,1fr) 18px;background:var(--panel);min-height:0}
#tlTools{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
#tlTools .spacer{flex:1}
#tlCorner{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#tlRulerWrap{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
#tlHeaders{border-right:1px solid var(--line);overflow:hidden}
#tlScroll{position:relative;overflow:auto;background:var(--bg)}
#tlLanes{position:relative;min-width:100%}
#playhead{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--danger);pointer-events:none;z-index:5}
#tlMini{grid-column:1/3;border-top:1px solid var(--line)}

#status{grid-area:status;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
#status .spacer{flex:1}
.badge{padding:0 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.badge.ok{color:var(--ok)} .badge.no{color:var(--faint);text-decoration:line-through}

/* ---------- Slots ---------- */
[data-slot]{position:relative;min-height:28px}
body.show-slots [data-slot]{outline:1px dashed var(--line2);outline-offset:-1px;background:rgba(56,200,216,.03)}
body.show-slots [data-slot]::before{content:attr(data-slot) " · S" attr(data-stage) " · " attr(data-el);position:absolute;inset:0;padding:4px 6px;font:10px/1.3 var(--mono);color:var(--faint);overflow:hidden;pointer-events:none}
body.show-slots [data-slot]:not(:empty)::before{display:none}
.slot-tall{min-height:90px} .slot-xl{min-height:140px}

/* ---------- Media library + feature LUT ---------- */
.dz{border:1px dashed var(--line2);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted)}
.dz p{margin-top:8px;font-size:12px}
.chips{display:flex;gap:4px}.chips button{padding:2px 8px;font-size:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.mcard.sel{border-color:var(--accent)}
.intel{display:grid;gap:6px;margin:6px 0}.intel .row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.intel input[type=search]{width:100%}.intel select{max-width:48%}
.mgh{grid-column:1/-1;font-weight:600;font-size:12px;padding-top:4px;color:var(--muted)}.mcard .bdg{font-size:10px;color:var(--warn)}
#dlg-media ul{margin:6px 0 10px 16px;padding:0}
.mcard .th{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.mcard .meta{padding:4px 6px;font-size:11px}
.mcard .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lut{width:100%;border-collapse:collapse;margin-bottom:12px}
.lut caption{text-align:left;font-weight:600;padding:6px 0}
.lut td{padding:3px 6px;border-bottom:1px solid var(--line);font-size:12px}
.st.done{color:var(--ok)}.st.partial{color:var(--warn)}.st.todo{color:var(--faint)}.st.experimental{color:var(--accent,#8b9cff)}
.lut .ai{font:9px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--muted)}
.bar{height:4px;background:var(--panel3);border-radius:2px;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

.clip{position:absolute;top:4px;bottom:4px;border-radius:3px;background:#2B6670;overflow:hidden;padding:3px 12px;font-size:11px;white-space:nowrap;cursor:pointer;user-select:none}
.clip[data-kind=audio]{background:#3B5A8C}.clip[data-kind=image]{background:#5E5290}
.clip.sel{outline:2px solid var(--accent);outline-offset:-1px}
.clip.hit{box-shadow:0 0 0 2px #F5C451 inset}.clip.bad{background-image:repeating-linear-gradient(45deg,rgba(240,97,109,.55) 0 6px,transparent 6px 12px)}
.clip.lnk{border-bottom:3px solid #B47CFF}.clip.grp{border-top:3px solid #6FD08C}.clip .dur{position:absolute;right:12px;top:3px;font-weight:400;opacity:.7;font-size:10px}
#tlTools2{grid-column:1/3;display:flex;align-items:center;gap:4px;padding:0 10px;overflow-x:auto;border-bottom:1px solid var(--line);white-space:nowrap}
#tlTools2 button{font-size:11px;padding:2px 7px;flex:none}#tlTools2 .sep{width:1px;height:16px;background:var(--line);flex:none}#tlTools2 .warnb{color:var(--warn)}
.edtip{position:fixed;z-index:99;display:none;background:#000c;color:#fff;font:11px var(--mono);padding:3px 6px;border-radius:3px;pointer-events:none}
#dlg-marker label,#dlg-edit label{display:block}
.clip .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.22)}
.clip .hd.l{left:0}.clip .hd.r{right:0}
#tlScroll{touch-action:pan-y}

.thead{height:48px;padding:4px 8px;border-bottom:1px solid var(--line)}
.thead .tn{font-size:12px;color:var(--muted);height:18px;overflow:hidden;white-space:nowrap}
.thead .tb{display:flex;gap:3px}.thead button{padding:0;width:22px;height:20px;font-size:10px}
.lane.locked{opacity:.55}.lane.hid .clip{opacity:.4}

.clip[data-kind=text],.clip[data-kind=sticker],.clip[data-kind=shape]{background:#8A5A2B}.clip[data-kind=caption]{background:#2F7D5B}
.fld{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.fld input[type=text],.fld input[type=number],.fld select{width:130px}

/* ---------- Dialogs ---------- */
dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:0;width:min(640px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
dialog .body{padding:14px;display:flex;flex-direction:column;gap:12px}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:12px;bottom:36px;display:flex;flex-direction:column;gap:6px;z-index:99}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:var(--r);max-width:340px}
.toast.error{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}

/* ---------- Stage 4: text, stickers, shapes, captions ---------- */
.capnote{font-size:11px;color:var(--muted);margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tpreset{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 6px;text-align:center;cursor:pointer;overflow:hidden}
.tpreset:hover,.tpreset:focus-visible{border-color:var(--accent)}
.tpreset .pv{display:block;font-weight:800;line-height:1.15;margin-bottom:5px;white-space:nowrap;overflow:hidden}
.tpreset>span:last-child{font-size:10px;color:var(--muted)}
.chiprow{display:flex;gap:4px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.sgrid button{aspect-ratio:1;display:grid;place-items:center;font-size:19px;padding:2px}
.sgrid button svg{width:72%;height:72%}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.ctabs button{padding:2px 8px;font-size:11px}
.crow{display:grid;grid-template-columns:58px 58px minmax(0,1fr) 24px 24px;gap:4px;align-items:center;margin-bottom:4px}
.crow input{min-width:0;padding:3px 4px;font-size:11px}
.crow button{width:24px;height:24px;padding:0;display:grid;place-items:center}
#canvasBox.draw-mode{cursor:crosshair;outline:1px dashed var(--accent);outline-offset:2px}
.fld input[type=color]{width:34px;height:24px;padding:1px;background:var(--bg)}
.fld input[type=range]{width:130px;accent-color:var(--accent)}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px;color:inherit;font:inherit;resize:vertical;width:100%}

/* ---------- Stage 5: transform, filters, effects ---------- */
.kbtn{width:20px;height:20px;padding:0;font-size:10px;color:var(--faint);background:transparent;border:1px dashed var(--line2);display:inline-grid;place-items:center}
.kbtn:hover{color:var(--warn);border-color:var(--warn)}
.trio{display:flex;gap:5px;align-items:center;flex:1}
.trio input[type=range]{flex:1;min-width:56px;accent-color:var(--accent)}
.trio input[type=number]{width:56px;padding:2px 4px;font-size:11px}
.fpair{display:flex;gap:6px}
.fpair>button{flex:1;font-size:11px;padding:3px}
.fpcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:center;padding:0}
.fpcard:hover,.fpcard:focus-visible{border-color:var(--accent)}
.fpcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.fpcard span{display:block;font-size:10px;color:var(--muted);padding:3px 2px}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.fxcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px;text-align:center;cursor:grab}
.fxcard:hover,.fxcard:focus-visible{border-color:var(--accent)}
.fxcard b{display:block;font-size:12px}
.fxcard i{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
.erow{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);margin-bottom:6px;overflow:hidden}
.erow.dragging{opacity:.4}
.erow .ehd{display:flex;align-items:center;gap:6px;padding:5px 6px;cursor:grab}
.erow .ehd b{flex:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .ehd button{width:22px;height:22px;padding:0;font-size:11px}
.erow .ebody{padding:3px 8px 8px;border-top:1px solid var(--line)}
.erow.off .ebody{opacity:.45}
.piprow{display:flex;gap:4px;flex-wrap:wrap}
.piprow button{flex:1;font-size:11px;padding:3px 2px;min-width:44px}
#selBox{position:absolute;border:1.5px solid var(--accent);pointer-events:none;display:none;z-index:6;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#selBox.move{pointer-events:auto;cursor:move}
#selBox .hnd{position:absolute;width:12px;height:12px;background:var(--accent);border:2px solid #06191C;border-radius:2px;pointer-events:auto}
[data-slot="preview-handles"]{pointer-events:none}
#selBox .hnd.rot{top:-14px;left:50%;margin-left:-7px;border-radius:50%;background:var(--warn);cursor:grab}
#selBox .hnd.nw{top:-7px;left:-7px;cursor:nwse-resize}
#selBox .hnd.ne{top:-7px;right:-7px;cursor:nesw-resize}
#selBox .hnd.sw{bottom:-7px;left:-7px;cursor:nesw-resize}
#selBox .hnd.se{bottom:-7px;right:-7px;cursor:nwse-resize}
#canvasBox.draw-mode #selBox{display:none!important}

/* ---------- Stage 6: audio ---------- */
.recRow{display:flex;gap:6px;align-items:center}
.recRow select{flex:1;min-width:0;font-size:11px}
#btnRec.recording{background:var(--danger);border-color:var(--danger);animation:recpulse 1.2s infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,97,109,.5)}55%{box-shadow:0 0 0 6px rgba(240,97,109,0)}}
#recMeter{width:100%;height:10px;background:#0d1216;border:1px solid var(--line);border-radius:3px;margin-top:6px;display:block}
.recMeta{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
.alib{display:flex;flex-direction:column;gap:6px}
.aitem{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.aitem canvas{width:104px;height:32px;background:#000;border-radius:3px;display:block}
.aitem .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem .mut{font-size:10px;color:var(--muted)}
.aitem .abtn{display:flex;flex-direction:column;gap:4px}
.aitem .abtn button{font-size:11px;padding:2px 8px;white-space:nowrap}
[data-slot="master-volume"]{display:flex;align-items:center;gap:6px}
#btnMute{width:26px;height:26px;padding:0;font-size:12px}
#masterVol{width:72px;accent-color:var(--accent)}
#masterMeter{width:56px;height:18px;background:#0d1216;border:1px solid var(--line);border-radius:3px;flex:none}
#vizCanvas{width:100%;height:110px;background:#000;border:1px solid var(--line);border-radius:var(--r);display:block}

/* ---------- Stage 7: transitions & keyframes ---------- */
.clip .tr{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(232,176,74,.8),rgba(232,176,74,0));border-right:1px solid rgba(232,176,74,.9);pointer-events:none;z-index:1}
.clip .kfm{position:absolute;bottom:3px;width:7px;height:7px;background:var(--warn);border:1px solid #06191C;transform:translateX(-50%) rotate(45deg);z-index:2;cursor:pointer}
.kbtn.on{color:var(--warn);border:1px solid var(--warn);border-style:solid}
.krow{display:grid;grid-template-columns:64px 70px 96px 24px 24px;gap:4px;align-items:center;margin-bottom:4px}
.krow input{min-width:0;padding:3px 4px;font-size:11px}
.krow select{padding:3px 4px;font-size:11px;width:100%}
.klegend{font-size:10px;color:var(--faint);margin-bottom:2px}
/* ---------- Stage 8: projects ---------- */
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:6px}
.prow .th{width:64px;height:36px;object-fit:cover;background:#000;border-radius:3px;display:block}
.prow .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:10px;color:var(--muted);margin-top:2px}
.pbtns{display:flex;gap:4px}
.pbtns button{font-size:11px;padding:2px 7px}
/* ---------- Stage 9: export ---------- */
.pbar{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
.exmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  :root{--left:260px;--right:240px;--timeline:260px}
}
@media (max-width:820px){ /* tablet: panels become drawers, timeline stays */
  #app{grid-template-columns:1fr;
    grid-template-rows:var(--topbar) minmax(0,1fr) var(--transport) var(--timeline) var(--status);
    grid-template-areas:"top" "preview" "transport" "timeline" "status"}
  #left,#right{position:fixed;top:var(--topbar);bottom:var(--status);width:min(320px,86vw);z-index:20;transform:translateX(-100%);transition:transform .15s}
  #right{right:0;left:auto;transform:translateX(100%)}
  #left.open,#right.open{transform:none}
  .only-narrow{display:inline-grid!important}
}
.only-narrow{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="show-slots">

<div id="app">

  <!-- ===================== TOP BAR ===================== -->
  <header id="topbar" role="toolbar" aria-label="Project">
    <button class="icon only-narrow" data-action="toggleLeft" aria-label="Media panel">☰</button>
    <span class="logo">Cutroom</span>
    <button data-action="newProject">New</button>
    <button data-action="openProjects">Open</button>
    <button data-action="saveProject">Save</button>
    <span class="sep"></span>
    <button data-action="undo" id="btnUndo" aria-label="Undo" disabled>Undo</button>
    <button data-action="redo" id="btnRedo" aria-label="Redo" disabled>Redo</button>
    <span class="spacer"></span>
    <input id="projectName" type="text" value="Untitled project" aria-label="Project name">
    <span class="muted" id="saveState">Not saved</span>
    <span class="spacer"></span>

        kernelMatrix="0 0 0 0 1 0 0 0 0"/>

<script>
"use strict";
/* =====================================================================
   CUTROOM — module skeleton. Everything below is a stub to be filled
   stage by stage. Classes are wired together through the EventBus and
   the single editorState; no module touches another's internals.
   ===================================================================== */

/* ---------- Central state (spec §31) ---------- */
const editorState = {
  project: { id: null, name: "Untitled project", width: 1920, height: 1080, fps: 30, duration: 0 },
  media: [],            // MediaItem { id, name, kind, mime, duration, width, height, handle|file, thumb, waveform }
  tracks: [],           // Track { id, kind:'video'|'image'|'text'|'audio', name, muted, hidden, locked, clips:[] }
                        // Clip  { id, mediaId, start, in, out, speed, transform, filters, effects, keyframes, transitionIn/out, volume, fadeIn, fadeOut, text? }
  currentTime: 0,
  selectedClip: null,
  selectedTrack: null,
  playback: { playing: false, loop: false, volume: 1, muted: false },                                          // Stage 6: muted feeds the master gain path
  ui: { zoom: 100, snap: true, markIn: null, markOut: null, tool: "select", autoGap: false, snapPx: 8, snapTo: { clips: 1, playhead: 1, markers: 1, range: 1, grid: 0 } },
  sel: [],              // Stage 2: multi-selection (clip ids); selectedClip stays the primary
  history: [], historyIndex: -1
};

/* ---------- Event bus ---------- */
const Bus = {
  _h: {},
  on(e, f){ (this._h[e] ||= []).push(f); return () => this.off(e, f); },
  off(e, f){ this._h[e] = (this._h[e] || []).filter(x => x !== f); },
  emit(e, d){ (this._h[e] || []).forEach(f => f(d)); }
};
/* Events: state:changed, time:changed, selection:changed, media:added, play:toggled, history:changed, project:loaded, export:progress */

/* ---------- Feature detection (spec §28) ---------- */
const Caps = {
  result: {},
  detect(){
    const r = this.result = {
      WebCodecs: "VideoEncoder" in window, WebGL2: !!document.createElement("canvas").getContext("webgl2"),
      WebGPU: "gpu" in navigator, MediaRecorder: "MediaRecorder" in window, IndexedDB: "indexedDB" in window,
      FSAccess: "showOpenFilePicker" in window, Workers: "Worker" in window, OffscreenCanvas: "OffscreenCanvas" in window
    };
    const box = document.getElementById("featureBadges");
    box.replaceChildren(...Object.entries(r).map(([k, v]) => {
      const s = document.createElement("span"); s.className = "badge " + (v ? "ok" : "no"); s.textContent = k; return s;
    }));
    return r;
  }
};

/* ---------- Command history (Stage 2+, spec §19) ---------- */
class HistoryManager {
  // Snapshot-based: each entry stores the tracks JSON before/after, so any future edit is undoable via run()/commit().
  snap(){ return JSON.stringify(editorState.tracks); }
  run(label, fn){
    if (typeof Users !== "undefined" && Users.list && !Users.canEdit()) return UI.toast(`The current user role (${Users.current()?.role}) can't edit the timeline — switch roles in Team & roles.`, "warn");
    const b = this.snap(); fn(); this.commit(label, b);
    if (typeof Activity !== "undefined") Activity.log(label);
  }
  commit(label, before){
    const s = editorState, after = this.snap();
    if (before === after) return Bus.emit("state:changed");
    s.history.length = s.historyIndex + 1; s.history.push({ label, before, after }); s.historyIndex++; this.fire();
  }
  apply(json){ editorState.tracks = JSON.parse(json); if (!Ed.findClip(editorState.selectedClip)) editorState.selectedClip = null; this.fire(); Bus.emit("history:applied"); }
  undo(){ const s = editorState; if (s.historyIndex >= 0) this.apply(s.history[s.historyIndex--].before); }
  redo(){ const s = editorState; if (s.historyIndex < s.history.length - 1) this.apply(s.history[++s.historyIndex].after); }
  fire(){ const s = editorState; document.getElementById("btnUndo").disabled = s.historyIndex < 0;
    document.getElementById("btnRedo").disabled = s.historyIndex >= s.history.length - 1; Bus.emit("state:changed"); }
}

/* ---------- Stage 1 ---------- */
class MediaManager {
  filter = "all"; sel = null;
  mountUI(){
    const dz = UI.slot("media-dropzone");
    dz.innerHTML = '<div class="dz"><button class="primary" id="btnImport">Import media</button><p>or drop video, image and audio files anywhere</p></div>';
    const fp = document.getElementById("filePicker");
    dz.querySelector("#btnImport").onclick = () => fp.click();
    fp.onchange = () => { this.importFiles([...fp.files]); fp.value = ""; };
    const f = UI.slot("media-filter");
    f.innerHTML = '<div class="chips">' + ["all", "video", "image", "audio"].map(k => `<button data-k="${k}" aria-pressed="${k === "all"}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("") + "</div>";
    f.onclick = e => { const b = e.target.closest("button"); if (!b) return; this.filter = b.dataset.k;
      f.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); this.renderGrid(); };
    this.grid = document.createElement("div"); this.grid.className = "mgrid"; UI.slot("media-grid").append(this.grid);
    Bus.on("media:added", () => this.renderGrid()); this.renderGrid();
  }
  async importFiles(files){
    for (const file of files){
      if (/\.srt$/i.test(file.name)){ try { TextFX.importSRT(await file.text()); } catch { UI.toast(`${file.name}: couldn't read this SRT file.`, "error"); } continue; }
      await this.importFile(file);
    }
  }
  async importFile(file){                                      // Stage 5: single-file import, reused by freeze-frame
    const kind = ["video", "image", "audio"].find(k => file.type.startsWith(k));
    if (!kind){ UI.toast(`${file.name}: unsupported file type.`, "error"); return null; }
    const item = { id: "m" + Math.random().toString(36).slice(2, 9), name: file.name, kind, mime: file.type, size: file.size,
      file, url: URL.createObjectURL(file), duration: 0, width: 0, height: 0, thumb: null, waveform: null };
    try { await this.probe(item); editorState.media.push(item); Bus.emit("media:added", item); Intel.enqueue(item); return item; }
    catch (err){ URL.revokeObjectURL(item.url); UI.toast(`${file.name}: ${err.message}`, "error"); return null; }
  }
  probe(item){
    return new Promise((res, rej) => {
      if (item.kind === "image"){
        const im = new Image();
        im.onload = () => { Object.assign(item, { width: im.naturalWidth, height: im.naturalHeight, duration: 5, thumb: this.thumbFrom(im, im.naturalWidth, im.naturalHeight) }); res(); };
        im.onerror = () => rej(new Error("This browser can't decode this image.")); im.src = item.url; return;
      }
      const el = document.createElement(item.kind); el.preload = "metadata"; el.muted = true; el.src = item.url;
      el.onerror = () => rej(new Error("This browser can't decode this format."));
      el.onloadedmetadata = async () => {
        if (!isFinite(el.duration)){                          // Stage 6: streamed recordings (MediaRecorder webm) report
          await new Promise(res => {                          // Infinity — seek to the far end to make the browser compute it
            const bail = setTimeout(res, 1500);
            el.onseeked = () => { clearTimeout(bail); el.currentTime = 0; res(); };
            try { el.currentTime = 1e7; } catch { clearTimeout(bail); res(); }
          });
        }
        if (!isFinite(el.duration) || !el.duration) return rej(new Error("Couldn't read the duration."));
        item.duration = el.duration;
        if (item.kind === "video"){
          item.width = el.videoWidth; item.height = el.videoHeight;
          el.onseeked = () => { item.thumb = this.thumbFrom(el, el.videoWidth, el.videoHeight); res(); };
          el.currentTime = Math.min(1, el.duration / 2);
        } else { item.waveform = await this.makeWaveform(item).catch(() => { UI.toast(`${item.name}: waveform unavailable.`, "warn"); return null; }); res(); }
      };
    });
  }
  thumbFrom(src, w, h){ const c = document.createElement("canvas"); c.width = 160; c.height = Math.round(160 * h / w) || 90;
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .7); }
  async makeWaveform(item){
    if (item.size > 200e6) throw new Error("too large");

/* ---------- Stage 7 : TransitionEngine — registry of A/B blends rendered on a per-track basis ----------

class TransitionEngine {
  registry = new Map();
  constructor(){
    const smooth = p => p * p * (3 - 2 * p);
    const R = (id, name, desc, apply) => this.register(id, { id, name, desc, apply });
    R("fade", "Fade", "Dips through black between the two clips", (g, a, b, p, W, H) => {
      g.drawImage(p < .5 ? a : b, 0, 0);
      g.save(); g.globalAlpha = p < .5 ? p * 2 : (1 - p) * 2; g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.restore();
    });
    R("crossfade", "Crossfade", "Blends the two clips directly", (g, a, b, p, W, H) => {
      g.drawImage(a, 0, 0); g.save(); g.globalAlpha = smooth(p); g.drawImage(b, 0, 0); g.restore();
    });

      g.drawImage(a, 0, 0);

    });

      g.drawImage(a, 0, 0); g.drawImage(b, (1 - (1 - Math.pow(1 - p, 3))) * W, 0);
    });
    R("push", "Push", "Both clips slide — the old one is pushed out", (g, a, b, p, W, H) => {
      const e = 1 - Math.pow(1 - p, 3); g.drawImage(a, -e * W, 0); g.drawImage(b, (1 - e) * W, 0);
    });
    R("zoom", "Zoom", "The new clip zooms in from the centre", (g, a, b, p, W, H) => {
      g.drawImage(a, 0, 0);

    });

      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)");

      g.drawImage(t, 0, 0);
    });

      g.save(); g.filter = `blur(${(p * 14).toFixed(1)}px)`; g.drawImage(a, 0, 0);

    });

class KeyframeEngine {
  PROPS = {
    x: { label: "Position X", min: -.5, max: 1.5, step: .005 },
    y: { label: "Position Y", min: -.5, max: 1.5, step: .005 },
    scale: { label: "Scale", min: .05, max: 8, step: .01 },
    rot: { label: "Rotation", min: -180, max: 180, step: 1 },
    opacity: { label: "Opacity", min: 0, max: 1, step: .01 },
    volume: { label: "Volume", min: 0, max: 2, step: .05 }
  };
  EASE = { linear: p => p, in: p => p * p * p, out: p => 1 - Math.pow(1 - p, 3),
    inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
  list(c, prop){ return c.keyframes?.[prop] || []; }
  add(c, prop, t, v, ease){
    const arr = (c.keyframes ||= {})[prop] ||= [];
    t = Math.max(0, +t) || 0;
    const i = arr.findIndex(k => Math.abs(k.t - t) < .02);   // same spot: update the value instead of stacking
    if (i >= 0){ arr[i].v = v; if (ease) arr[i].ease = ease; }
    else { arr.push({ t, v, ease: ease || "linear" }); arr.sort((a, b) => a.t - b.t); }
  }

    const arr = c.keyframes?.[prop]; if (!arr || !arr.length) return undefined;

  clipVol(c, t){            // clip volume × clip mute × fades × master — written to element.volume every playback frame
    const p = editorState.playback;
    let v = (c.volume ?? 1) * (c.muted ? 0 : 1) * (p.muted ? 0 : p.volume);
    const kf = c.keyframes?.volume; if (kf?.length) v *= Fx.clamp(Kf.valueAt(c, "volume", t - c.start), 0, 2);   // Stage 7: volume keyframes ride on top
    const lt = t - c.start, rem = Ed.end(c) - t;
    if (c.fadeIn > 0 && lt < c.fadeIn) v *= Math.max(0, lt / c.fadeIn);
    if (c.fadeOut > 0 && rem < c.fadeOut) v *= Math.max(0, rem / c.fadeOut);
    return Fx.clamp(v, 0, 1);
  }
  levels(){                                                 // post-master stereo RMS (0..1) for the transport meter
    if (!this.ctx || !this.anaL) return { l: 0, r: 0 };
    const rms = a => { const b = this._mb ||= new Uint8Array(a.fftSize); a.getByteTimeDomainData(b);
      let s = 0; for (let i = 0; i < b.length; i++){ const v = (b[i] - 128) / 128; s += v * v; } return Math.sqrt(s / b.length); };
    return { l: rms(this.anaL), r: rms(this.anaR) };
  }
  async startRecording(){
    if (this.rec.active) return;
    if (!navigator.mediaDevices?.getUserMedia) return UI.toast("This browser can't record audio.", "error");
    try {
      const dev = AudioUI.devId;
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: dev ? { exact: dev } : undefined, echoCancellation: true, noiseSuppression: true } });
      this.rec = { active: true, stream, chunks: [], t0: Date.now() };
      const ctx = this.ready();                             // meter the mic even before playback ever started
      if (ctx){ try { const src = ctx.createMediaStreamSource(stream), ana = ctx.createAnalyser(); ana.fftSize = 512; src.connect(ana); this.rec.ana = ana; } catch {} }
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data?.size) this.rec.chunks.push(e.data); };
      mr.onstop = () => this.finishRecording();
      mr.start(200); this.rec.recorder = mr;
      AudioUI.recState(true);
    } catch { UI.toast("Couldn't access the microphone — check browser permissions.", "error"); }
  }
  stopRecording(cancel){
    if (!this.rec.active) return;
    this.rec.cancelled = !!cancel;
    this.rec.recorder?.stop();
  }
  finishRecording(){
    const { stream, chunks, cancelled } = this.rec;
    this.rec = { active: false };
    stream?.getTracks().forEach(t => t.stop());
    AudioUI.recState(false);
    if (cancelled) return UI.toast("Recording discarded.");
    if (!chunks.length) return UI.toast("Nothing was captured.", "warn");
    const type = chunks[0].type || "audio/webm", ext = (type.split("/")[1] || "webm").split(";")[0];
    const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, "-");
    const file = new File([new Blob(chunks, { type })], `voiceover-${stamp}.${ext}`, { type });
    Media.importFile(file).then(item => {
      if (!item) return;
      Hist.run("Add voiceover", () => {                     // drop it on the targeted audio track at the playhead (Stage 3 targeting)
        const k = TrackUI.pickTrack("audio");
        if (!k) return;
        const c = { id: Ed.mkId("c"), mediaId: item.id, start: 0, in: 0, out: item.duration, speed: 1, volume: 1 };
        c.start = Ed.fitStart(k, c, editorState.currentTime);
        k.clips.push(c); k.clips.sort((a, b) => a.start - b.start); editorState.selectedClip = c.id;
      });
      Bus.emit("selection:changed");
      UI.toast("Voiceover imported and placed on the audio track at the playhead.");
    });
  }
}
const Sound = new AudioEngine();

/* ---------- Stage 6 : AudioUI — recorder, audio library, master meter, per-clip volume / EQ / spectrum panes ---------- */
const AudioUI = {
  devId: null, preview: null, vizCv: null, vizClip: null, _audioCount: -1,
  mount(){
    this.mountRecorder(); this.mountMaster(); this.mountLibrary();
    Bus.on("media:added", () => this.mountLibrary());
    const tick = () => { requestAnimationFrame(tick); this.tick(); };
    requestAnimationFrame(tick);
    addEventListener("pointerdown", () => Sound.resume(), { capture: true });   // unlock audio on the first interaction anywhere
  },
  /* --- voice recorder (audio-recorder slot) --- */
  mountRecorder(){
    const slot = UI.slot("audio-recorder");
    slot.innerHTML = '<h3>Voice recorder</h3><div class="recRow"><select id="micSel" title="Input device"></select>' +
      '<button id="btnRec">● Record</button></div><canvas id="recMeter" width="240" height="10"></canvas>' +
      '<div class="recMeta"><span id="recTime">0:00</span><span class="muted" id="recHint">Microphone idle</span></div>';
    this.recBtn = slot.querySelector("#btnRec"); this.recTime = slot.querySelector("#recTime");
    this.recHint = slot.querySelector("#recHint"); this.recMeter = slot.querySelector("#recMeter"); this.micSel = slot.querySelector("#micSel");
    this.recBtn.onclick = () => Sound.rec.active ? Sound.stopRecording(false) : Sound.startRecording();
    this.micSel.onchange = () => this.devId = this.micSel.value || null;
    this.refreshDevices();
  },
  async refreshDevices(){
    try {
      const devs = (await navigator.mediaDevices?.enumerateDevices?.())?.filter(d => d.kind === "audioinput") || [];
      const sel = this.micSel; if (!sel) return;
      if (!devs.length){ const o = document.createElement("option"); o.textContent = "Default input"; sel.replaceChildren(o); return; }
      sel.replaceChildren(...devs.map((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || `Microphone ${i + 1}`; return o; }));
    } catch {}
  },
  recState(on){
    if (!this.recBtn) return;

  },
  drawLevel(v){
    const cv = this.recMeter; if (!cv) return;
    const g = cv.getContext("2d"), W = cv.width, H = cv.height;
    g.fillStyle = "#0d1216"; g.fillRect(0, 0, W, H);
    g.fillStyle = v > .85 ? "#F0616D" : "#38C8D8";

  },
  /* --- audio library (audio-library slot) --- */
  mountLibrary(){
    const slot = UI.slot("audio-library"), items = editorState.media.filter(m => m.kind === "audio");
    if (items.length === this._audioCount && slot.firstChild) return;           // don't rebuild (and kill a playing preview) needlessly
    this._audioCount = items.length;
    slot.replaceChildren();
    slot.append(Object.assign(document.createElement("h3"), { textContent: "Audio library" }));
    if (!items.length){ slot.append(Object.assign(document.createElement("p"), { className: "muted", textContent: "No audio yet — import files or record a voiceover." })); return; }
    const list = document.createElement("div"); list.className = "alib";
    for (const m of items){
      const row = document.createElement("div"); row.className = "aitem";

      drawWave(cv.getContext("2d"), cv.width, cv.height, m.waveform, "#38C8D8", .8);
      const meta = document.createElement("div");
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = nm.title = m.name;
      const du = document.createElement("div"); du.className = "mut"; du.textContent = `${fmtDur(m.duration)} · ${m.mime || "audio"}`;
      meta.append(nm, du);

      play.onclick = () => this.togglePreview(m, play);

      add.onclick = () => Ed.addClipFromMedia(m.id);

      bpm.onclick = () => AudioFX.analyzeBeats(m);

  togglePreview(m, btn){

      .catch(() => UI.toast("This browser can't play this file.", "error"));
  },
  stopPreview(){
    if (!this.preview) return;
    this.preview.el.pause();
    if (this.preview.btn?.isConnected) this.preview.btn.textContent = "▶ Play";

  /* --- master volume (master-volume slot in the transport bar) --- */
  mountMaster(){

      '<input type="range" id="masterVol" min="0" max="100" value="100" title="Master volume">' +
      '<canvas id="masterMeter" width="56" height="18" title="Output level (L / R)"></canvas>';

  drawMeter(cv, l, r){
    if (!cv) return;
    const g = cv.getContext("2d"), W = cv.width, H = cv.height, h2 = H / 2;
    g.fillStyle = "#0d1216"; g.fillRect(0, 0, W, H);
    const bar = (v, y) => { g.fillStyle = v > .92 ? "#F0616D" : v > .7 ? "#E0B04C" : "#38C8D8";
      g.fillRect(0, y + 1, Math.max(1, Math.min(1, v) * W), h2 - 2); };
    bar(l, 0); bar(r, h2);
  },
  /* --- per-clip panes (called from ClipProps.buildAudio) --- */
  buildVolume(c){
    const slot = UI.slot("prop-volume"); slot.replaceChildren();
    const kind = editorState.media.find(x => x.id === c.mediaId)?.kind;
    if (kind === "image") return slot.append(Object.assign(document.createElement("p"), { className: "muted", textContent: "Image clips are silent." }));
    ClipProps.head(slot, "Clip volume & fades");
    ClipProps.trio(slot, "Volume %", Math.round((c.volume ?? 1) * 100), 0, 200, 1, v => c.volume = v / 100, "Clip volume", { c, prop: "volume", get: () => c.volume ?? 1 });
    const mu = OverlayProps.chk(!!c.muted);
    mu.onchange = () => Hist.run("Mute clip", () => c.muted = mu.checked);
    OverlayProps.row(slot, "Mute clip", mu);
    const fi = OverlayProps.num(c.fadeIn || 0, 0, 30, .1);
    OverlayProps.wire(fi, "Fade in", () => c.fadeIn = Math.max(0, OverlayProps.numVal(fi, 0)));
    OverlayProps.row(slot, "Fade in (s)", fi);
    const fo = OverlayProps.num(c.fadeOut || 0, 0, 30, .1);
    OverlayProps.wire(fo, "Fade out", () => c.fadeOut = Math.max(0, OverlayProps.numVal(fo, 0)));
    OverlayProps.row(slot, "Fade out (s)", fo);
    slot.append(Object.assign(document.createElement("p"), { className: "capnote", textContent: "Fades shape this clip's loudness at its edges. Track mute (M) and the master slider apply on top." }));
  },
  buildEq(c){
    const slot = UI.slot("prop-eq"); slot.replaceChildren();
    const kind = editorState.media.find(x => x.id === c.mediaId)?.kind;
    if (kind === "image") return slot.append(Object.assign(document.createElement("p"), { className: "muted", textContent: "Image clips are silent." }));
    const eq = c.eq ||= { low: 0, mid1: 0, mid2: 0, high: 0 };
    ClipProps.head(slot, "Equalizer");
    ClipProps.trio(slot, "Low · 180 Hz", eq.low, -12, 12, .5, v => { eq.low = v; Sound.applyClip(c); }, "EQ low");
    ClipProps.trio(slot, "Mid · 900 Hz", eq.mid1, -12, 12, .5, v => { eq.mid1 = v; Sound.applyClip(c); }, "EQ mid 1");
    ClipProps.trio(slot, "Mid · 2.8 kHz", eq.mid2, -12, 12, .5, v => { eq.mid2 = v; Sound.applyClip(c); }, "EQ mid 2");
    ClipProps.trio(slot, "High · 7.5 kHz", eq.high, -12, 12, .5, v => { eq.high = v; Sound.applyClip(c); }, "EQ high");
    const flat = document.createElement("button"); flat.textContent = "Reset EQ";
    flat.onclick = () => Hist.run("Reset EQ", () => { Object.assign(eq, { low: 0, mid1: 0, mid2: 0, high: 0 }); Sound.applyClip(c); this.buildEq(c); });
    OverlayProps.row(slot, "Reset", flat);
    const nr = OverlayProps.chk(!!c.nr);
    nr.onchange = () => Hist.run("Noise reduction", () => { c.nr = nr.checked; Sound.applyClip(c); });
    OverlayProps.row(slot, "Noise reduction", nr);
    /* Stage 6: audio effects — dynamics, de-esser, reverb, echo removal, gate, leveler */
    const fx = c.fx ||= {};
    ClipProps.head(slot, "Audio effects");
    const mkChk = (key, label, title) => { const b = OverlayProps.chk(!!fx[key]); b.title = title;
      b.onchange = () => Hist.run(label, () => { fx[key] = b.checked; Sound.applyClip(c); }); return b; };
    OverlayProps.row(slot, "Compressor", mkChk("comp", "Compressor", "DynamicsCompressor: evens out loudness swings"));
    const compTh = ClipProps.trio(slot, "Comp threshold dB", fx.compThreshold ?? -28, -60, 0, 1, v => { fx.compThreshold = v; Sound.applyClip(c); }, "Compressor threshold");
    OverlayProps.row(slot, "De-esser", mkChk("deesser", "De-esser", "Ducks the high band when sibilance spikes"));
    OverlayProps.row(slot, "Reverb", mkChk("reverb", "Reverb", "Adds a generated room reverb (ConvolverNode)"));
    const rvMix = ClipProps.trio(slot, "Reverb mix", Math.round((fx.reverbMix ?? .22) * 100), 0, 80, 1, v => { fx.reverbMix = v / 100; Sound.applyClip(c); }, "Reverb mix");
    OverlayProps.row(slot, "Echo removal", mkChk("echoRemove", "Echo removal", "Inverse-comb notch — tune the delay to the room echo"));
    const ecD = ClipProps.trio(slot, "Echo delay ms", Math.round((fx.echoDelay ?? .12) * 1000), 5, 450, 5, v => { fx.echoDelay = v / 1000; Sound.applyClip(c); }, "Echo delay");
    OverlayProps.row(slot, "Noise gate", mkChk("gate", "Noise gate", "Mutes the clip when the level falls under the threshold"));
    OverlayProps.row(slot, "Dialogue leveler", mkChk("leveler", "Dialogue leveler", "Rides the gain toward the target loudness (automatic dialogue leveling)"));
    const lvT = ClipProps.trio(slot, "Level target dB", fx.levelTarget ?? -18, -36, -6, 1, v => { fx.levelTarget = v; Sound.applyClip(c); }, "Level target");
    /* Stage 6: normalization + A/V sync */
    const nb = document.createElement("div"); nb.className = "fpair";
    const bpk = document.createElement("button"); bpk.textContent = "Normalize peak"; bpk.onclick = () => AudioFX.normalize(c, "peak");
    const bld = document.createElement("button"); bld.textContent = "Normalize loudness"; bld.onclick = () => AudioFX.normalize(c, "loud");
    nb.append(bpk, bld);
    OverlayProps.row(slot, "Normalize", nb);
    const avb = document.createElement("button"); avb.textContent = "Sync A/V by waveform"; avb.onclick = () => AudioFX.syncAV();
    OverlayProps.row(slot, "A/V sync", avb);
    slot.append(Object.assign(document.createElement("p"), { className: "capnote", textContent: "Effects run in the per-clip Web Audio chain: EQ → gate → compressor → limiter → de-esser → echo-cancel → reverb → leveler. All offline — nothing leaves the browser." }));
    slot.append(Object.assign(document.createElement("p"), { className: "capnote", textContent: "Noise reduction band-limits the clip (95 Hz – 11.5 kHz) and ducks the output whenever the level sits under the noise floor." }));
  },
  buildViz(c){
    const slot = UI.slot("prop-audio-viz"); slot.replaceChildren();
    const kind = editorState.media.find(x => x.id === c.mediaId)?.kind;
    const cv = document.createElement("canvas"); cv.id = "vizCanvas"; cv.width = 320; cv.height = 120;
    slot.append(cv, Object.assign(document.createElement("p"), { className: "capnote", textContent: "Live spectrum while the timeline plays; static waveform when paused." }));
    this.vizCv = cv; this.vizClip = c.id;
    if (kind === "video"){                               // video: pull the audio track once so the paused view has a waveform
      const m = editorState.media.find(x => x.id === c.mediaId);
      if (m && !m.waveform && !m.waveTried){ m.waveTried = true;
        Media.makeWaveform(m).then(w => { m.waveform = w; if (this.vizClip === c.id) this.drawViz(); }).catch(() => {});
      }
    }
  },
  drawViz(){
    const cv = this.vizCv;
    if (!cv || !cv.isConnected) return;
    const g = cv.getContext("2d"), W = cv.width, H = cv.height;
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    const c = Ed.findClip(editorState.selectedClip)?.c;
    if (!c || this.vizClip !== c.id) return;
    const ch = Sound.chains.get(c.id);
    if (ch && Play.playing){                             // live spectrum, log-spaced bars
      const N = 48, data = this._fd ||= new Uint8Array(ch.ana.frequencyBinCount);
      ch.ana.getByteFrequencyData(data);
      for (let i = 0; i < N; i++){
        const idx = Math.min(data.length - 1, Math.floor(Math.pow(i / N, 1.8) * data.length));
        const v = data[idx] / 255, h = Math.max(2, v * (H - 4));
        g.fillStyle = `hsl(${168 + v * 92} 65% ${34 + v * 26}%)`;
        g.fillRect(i / N * W + 1, H - h, W / N - 2, h);
      }
      return;
    }
    const m = editorState.media.find(x => x.id === c.mediaId);
    if (!m?.waveform){ g.fillStyle = "#2A323E"; g.font = "11px sans-serif"; g.textAlign = "center"; g.fillText("No waveform available", W / 2, H / 2); return; }
    drawWave(g, W, H, m.waveform, "#38C8D8", .85);
    const local = (editorState.currentTime - c.start) * (c.speed || 1) + (c.in || 0);
    const frac = Fx.clamp(local / Math.max(.001, m.duration), 0, 1);
    g.fillStyle = "#F0616D"; g.fillRect(frac * W - 1, 0, 2, H);
  },
  /* --- per-frame housekeeping: meters, NR gates, recorder UI, spectrum, dynamics, ducking --- */
  tick(){
    const lv = Sound.levels();
    this.drawMeter(this.masterMeter, lv.l, lv.r);
    const r = Sound.rec;
    if (r.active){
      let v = 0;
      if (r.ana){ const b = this._rb ||= new Uint8Array(r.ana.fftSize); r.ana.getByteTimeDomainData(b);
        let s = 0; for (let i = 0; i < b.length; i++){ const x = (b[i] - 128) / 128; s += x * x; } v = Math.sqrt(s / b.length); }
      this.drawLevel(v);
      const s = Math.floor((Date.now() - r.t0) / 1000);
      this.recTime.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
    }
    if (Play.playing && Sound.ctx){
      const act = Play.active(editorState.currentTime);
      for (const { c, m } of act) if (m && (c.nr || c.fx)) { Sound.gate(c); Sound.dynamics(c); }
      AudioFX.duckFrame(act);                                  // Stage 6: music beds duck under voice clips
    }
    this.drawViz();
    AudioFX.lufsTick();                                        // Stage 6: integrated LUFS metering
    if (Play.playing) this.stopPreview();
  }
};

/* ---------- Stage 8 : ProjectManager — IndexedDB save / load / autosave + portable .cutroom.json files ----------
   A record stores the full editor state (tracks, clips — transitions and keyframes included — and media
   metadata) plus the imported files as Blobs, so a saved project reopens exactly as it was left.        */
class ProjectManager {
  db = null; dirty = false; suppress = false; created = null;
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!("indexedDB" in window)) return rej(new Error("IndexedDB unavailable"));
      const rq = indexedDB.open("cutroom", 2);                       // v2: versions store for Stage 8 version history
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains("projects")) db.createObjectStore("projects", { keyPath: "id" });
        if (!db.objectStoreNames.contains("versions")){ const vs = db.createObjectStore("versions", { keyPath: "id" }); vs.createIndex("projectId", "projectId", { unique: false }); }
      };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error || new Error("IndexedDB unavailable"));
    });
  }
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("projects", mode), rq = fn(t.objectStore("projects"));
      t.oncomplete = () => res(rq?.result);
      t.onerror = () => rej(t.error || new Error("IndexedDB operation failed"));
    });
  }
  put(rec){ return this.tx("readwrite", st => st.put(rec)); }
  get(id){ return this.tx("readonly", st => st.get(id)); }
  list(){ return this.tx("readonly", st => st.getAll()); }
  remove(id){ return this.tx("readwrite", st => st.delete(id)); }
  serialize(){
    const s = editorState;
    return {
      v: 1,
      project: JSON.parse(JSON.stringify(s.project)),
      tracks: JSON.parse(JSON.stringify(s.tracks)),
      ui: { zoom: s.ui.zoom, snap: s.ui.snap },
      playback: { volume: s.playback.volume, loop: s.playback.loop },
      media: s.media.map(m => ({ id: m.id, name: m.name, kind: m.kind, mime: m.mime, size: m.size, duration: m.duration, width: m.width, height: m.height, thumb: m.thumb, waveform: m.waveform, info: m.info, fp: m.fp, group: m.group, hasProxy: !!m.proxy })),
      files: s.media.reduce((o, m) => { if (m.file) o[m.id] = m.file; if (m.proxy?.file) o["proxy_" + m.id] = m.proxy.file; return o; }, {})
    };
  }
  async save(){
    const s = editorState;
    if (!s.project.id) s.project.id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const rec = { id: s.project.id, name: s.project.name || "Untitled project", modified: Date.now(), created: this.created ||= Date.now(), data: this.serialize() };
    await this.put(rec);
    this.dirty = false;
    ProjectsUI.state("Saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
    Bus.emit("projects:changed");
    return rec;
  }
  async rename(id, name){
    const rec = await this.get(id); if (!rec) return;
    rec.name = name; rec.modified = Date.now();
    if (editorState.project.id === id){ editorState.project.name = name; const inp = document.getElementById("projectName"); if (inp) inp.value = name; }
    await this.put(rec); Bus.emit("projects:changed");
  }
  async duplicate(id){
    const rec = await this.get(id); if (!rec) return;
    const copy = { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: rec.name + " (copy)", modified: Date.now(), created: Date.now(),

/* ---------- Stage 9 : ExportManager — real-time local render via canvas capture + MediaRecorder ----------
   The timeline plays through once into an offscreen canvas at the chosen resolution while the audio graph
   feeds a MediaStream — WebM everywhere, MP4 where the browser can mux it. Fully offline: nothing uploads. */
class ExportManager {
  st = null; queue = []; chunks = [];
  FORMATS(){
    const mr = window.MediaRecorder;
    const pick = cands => cands.find(m => mr?.isTypeSupported?.(m)) || null;
    return { rec: !!mr,
      webm: pick(["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]),
      mp4: pick(["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4"]) };
  }
  bitrate(w, h, fps, q){ const f = { low: .06, med: .11, high: .19, ultra: .3 }[q] || .11; return Math.round(w * h * fps * f); }
  estimateSize(opts){ const d = Ed.duration(); if (!d) return 0; return (this.bitrate(opts.width, opts.height, opts.fps, opts.quality) + opts.abps * 1000) / 8 * d; }
  autoName(opts){                                            // Stage 9: automatic filename generation
    const stamp = new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-");
    const bits = [editorState.project.name || "export", opts.presetName || `${opts.height}p${opts.fps}`, stamp].filter(Boolean);
    return bits.join("-").replace(/\s+/g, "-").replace(/[^\w.-]/g, "") + (opts.format === "mp4" ? ".mp4" : ".webm");
  }
  async start(opts){
    if (this.st?.active) return false;
    setMode("timeline"); Play.pause(); AudioUI.stopPreview();
    const fullDur = Ed.duration();
    if (!fullDur){ UI.toast("Nothing to export — the timeline is empty.", "warn"); return false; }
    /* Stage 9: export the selected range (In/Out) when asked */
    const r = Edits.range();
    const win = opts.range && r ? { in: Fx.clamp(r.in, 0, fullDur), out: Fx.clamp(r.out, 0, fullDur) } : { in: 0, out: fullDur };
    if (win.out - win.in < .1){ UI.toast("The export range is too short.", "warn"); return false; }
    const dur = win.out - win.in;
    const mime = this.FORMATS()[opts.format];
    if (!mime){ UI.toast(opts.format === "mp4" ? "MP4 isn't supported by this browser — export WebM instead." : "This browser can't record video.", "error"); return false; }
    /* Stage 9: per-clip / per-track export — temporarily isolate the target */
    const isolate = { hidden: [], muted: [] };
    if (opts.clipId || opts.trackId){
      for (const k of editorState.tracks){
        const keep = opts.trackId ? k.id === opts.trackId : k.clips.some(c => c.id === opts.clipId);
        if (!keep){ if (!k.hidden){ k.hidden = true; isolate.hidden.push(k); } }
        else if (opts.clipId){ for (const c of k.clips) if (c.id !== opts.clipId && !c.hidden2){ c.hidden2 = true; isolate.muted.push(c); } }
      }
    }
    /* Stage 9: hardware/GPU — desynchronized 2D context hands the canvas to the platform compositor when possible */
    const stage = document.createElement("canvas"); stage.width = editorState.project.width; stage.height = editorState.project.height;
    const sctx = stage.getContext("2d", { desynchronized: true, alpha: false });
    const canvas = document.createElement("canvas"); canvas.width = opts.width; canvas.height = opts.height;
    const ectx = canvas.getContext("2d", { desynchronized: true, alpha: false });
    let vstream;
    try { vstream = canvas.captureStream(opts.fps); } catch { UI.toast("This browser can't capture canvas streams.", "error"); return false; }
    let astream = null, dest = null, noAudio = false;
    const actx = Sound.ready();
    if (actx){                                              // a suspended context would starve the muxer → zero-byte file,
      Sound.resume();                                        // so only attach audio when the context is actually running
      try { await actx.resume(); } catch {}
      if (actx.state === "running"){ try { dest = actx.createMediaStreamDestination(); Sound.master.connect(dest); astream = dest.stream; } catch {} }
      else noAudio = true;
    }
    const stream = new MediaStream([...vstream.getVideoTracks(), ...(astream ? astream.getAudioTracks() : [])]);
    const vbps = opts.cbr && opts.customBitrate ? Math.round(opts.customBitrate * 1e6) : this.bitrate(opts.width, opts.height, opts.fps, opts.quality);
    let rec;
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: vbps, audioBitsPerSecond: opts.abps * 1000 }); }
    catch (e){ UI.toast("Couldn't start the recorder: " + e.message, "error"); if (dest){ try { Sound.master.disconnect(dest); } catch {} } return false; }
    const saved = { cv: Video.cv, ctx: Video.ctx };
    Video.cv = stage; Video.ctx = sctx;                      // the pipeline draws into the project-size stage canvas
    this.st = { active: true, paused: false, cancelled: false, t0: performance.now() - win.in * 1000, win, dur, frames: Math.max(1, Math.ceil(dur * opts.fps)), rec, saved, dest, stream,
      raf: 0, opts, canvas, ectx, stage, sctx, isolate, chunks: [], name: opts.name || this.autoName(opts), drawn: 0, started: performance.now() };
    Play.playing = true;                                     // real-time pass: elements play naturally, no per-frame seeking
    document.getElementById("btnPlay").textContent = "⏸";
    rec.ondataavailable = e => { if (e.data?.size) this.st.chunks.push(e.data); };
    rec.onstop = () => this.assemble();
    rec.start(400);
    const fitDraw = () => {                                   // Stage 9: multiple aspect ratios — contain (letterbox) or cover (crop)
      const sw = stage.width, sh = stage.height, W = opts.width, H = opts.height, sa = sw / sh, ta = W / H;
      ectx.fillStyle = "#000"; ectx.fillRect(0, 0, W, H);
      if (opts.fit === "cover" || Math.abs(sa - ta) < .001){
        if (sa > ta){ const hh = W / sa; ectx.drawImage(stage, 0, (sh - hh) / 2, sw, hh, 0, 0, W, H); }
        else { const ww = H * sa; ectx.drawImage(stage, (sw - ww) / 2, 0, ww, sh, 0, 0, W, H); }
      } else {
        if (sa > ta){ const hh = W / sa; ectx.drawImage(stage, 0, 0, sw, sh, 0, (H - hh) / 2, W, hh); }
        else { const ww = H * sa; ectx.drawImage(stage, 0, 0, sw, sh, (W - ww) / 2, 0, ww, H); }
      }
    };
    const loop = () => {
      const st = this.st; if (!st || !st.active || st.paused) return;
      const t = (performance.now() - st.t0) / 1000;
      if (t >= st.win.out) return this.finish();
      editorState.currentTime = t;
      Play.sync(t); Play.render();
      fitDraw(); st.drawn++;
      Play.tc();
      ExportUI.progress((t - st.win.in) / st.dur, Math.min(st.frames, Math.round((t - st.win.in) * opts.fps)), st.frames, st.win.out - t);
      st.raf = requestAnimationFrame(loop);
    };
    this.st.fitDraw = fitDraw; fitDraw();
    this.st.raf = requestAnimationFrame(loop);
    /* Stage 9: background rendering pump — setInterval keeps frames flowing (throttled) while the tab is hidden */
    this.st.pump = setInterval(() => { const st = this.st; if (!st?.active || st.paused || !document.hidden) return; const t = (performance.now() - st.t0) / 1000;

         "ctrl+z": "undo", "ctrl+y": "redo", "ctrl+shift+z": "redo", "ctrl+s": "saveProject", "ctrl+e": "openExport", "ctrl+d": "duplicate" },
  init(){

/* ---------- Stage 4 : FontMgr — custom font import & management (FontFace API) ---------- */
const FontMgr = {
  list(){ return editorState.project.fonts ||= []; },
  cssFont(f){ return f; },
  async importFiles(files){
    for (const file of files){
      if (!/\.(ttf|otf|woff2?|ttc)$/i.test(file.name)){ UI.toast(`${file.name}: not a font file.`, "error"); continue; }
      try {
        const buf = await file.arrayBuffer();
        const face = new FontFace("crf-" + file.name.replace(/\.[^.]+$/, "").replace(/\s+/g, "-"), buf);
        await face.load(); document.fonts.add(face);
        const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(file); });
        this.list().push({ name: file.name, family: face.family, data });
        OverlayProps.builtFor = null; renderProps();
        UI.toast(`Font "${file.name}" installed.`);
      } catch { UI.toast(`${file.name}: this browser can't load that font.`, "error"); }
    }
    Bus.emit("state:changed");
  },
  registerAll(){
    for (const f of this.list()){
      if (document.fonts?.check?.(`12px ${f.family}`)) continue;
      try {
        const b64 = f.data.split(",")[1], bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const face = new FontFace(f.family, bin.buffer); face.load().then(x => document.fonts.add(x)).catch(() => {});
      } catch {}
    }
  },
  fonts(){ return [...TextFX.FONTS, ...this.list().map(f => [f.family, f.name.replace(/\.[^.]+$/, "") + " (custom)"])]; },
  manage(){
    const d = this.dlg ||= Object.assign(document.createElement("dialog"), { id: "dlg-fonts" }); if (!d.isConnected) document.body.append(d);
    const draw = () => {
      const L = this.list();
      d.innerHTML = `<header>Font management <button class="icon" data-close aria-label="Close">✕</button></header><div class="body" style="max-height:60vh;overflow:auto">
        <div class="fpair"><button class="primary" id="fmAdd">Add font files…</button><span class="muted">TTF / OTF / WOFF — stored in the project</span></div>
        ${L.length ? `<table class="lut">${L.map((f, i) => `<tr><td style="font-family:'${f.family}'">${f.name.replace(/</g, "&lt;")}</td><td class="muted">${f.family}</td><td width="60"><button data-i="${i}">Remove</button></td></tr>`).join("")}</table>`
          : '<p class="muted">No custom fonts yet. Installed fonts appear in every font picker.</p>'}</div><footer><button data-close>Close</button></footer>`;
      d.querySelector("#fmAdd").onclick = () => { const i = Object.assign(document.createElement("input"), { type: "file", multiple: true, accept: ".ttf,.otf,.woff,.woff2,font/*" });
        i.onchange = async () => { await this.importFiles([...i.files]); draw(); }; i.click(); };
      d.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { Hist.run("Remove font", () => this.list().splice(+b.dataset.i, 1)); draw(); });
    };
    d.onclick = e => { if (e.target.closest("[data-close]")) d.close(); }; draw(); d.showModal();
  }
};

  },
  apply(){                                                   // CSS zoom of the canvas box (preview only, never export)
    const box = document.getElementById("canvasBox");
    box.style.maxWidth = box.style.maxHeight = "";
    box.style.width = box.style.height = "";
    if (this.mode === "fit"){ return; }
    const pct = +this.mode / 100;
    const stage = document.getElementById("stage"), r = stage.getBoundingClientRect();
    const w = Math.min(r.width * pct, r.width), h = Math.min(r.height * pct, r.height);
    box.style.maxWidth = "none"; box.style.maxHeight = "none";

  /* Stage 4: caption safe area — 90% title / 93% action safe; also clamps overlay positions */

  safeOn(){ return this.safe; },
  render(g, W, H){                                           // called after the frame is composed
    if (this.grid){
      g.save(); g.strokeStyle = "rgba(232,234,240,.28)"; g.lineWidth = 2;
      for (let i = 1; i < 3; i++){ g.beginPath(); g.moveTo(W * i / 3, 0); g.lineTo(W * i / 3, H); g.stroke(); g.beginPath(); g.moveTo(0, H * i / 3); g.lineTo(W, H * i / 3); g.stroke(); }
      g.restore();
    }
    if (this.aspect !== "off"){
      const [aw, ah] = this.aspect.split(":").map(Number), target = aw / ah, cur = W / H;
      g.save(); g.fillStyle = "rgba(0,0,0,.62)";
      if (cur > target){ const w = H * target; g.fillRect(0, 0, (W - w) / 2, H); g.fillRect(W - (W - w) / 2, 0, (W - w) / 2, H); }
      else { const h = W / target; g.fillRect(0, 0, W, (H - h) / 2); g.fillRect(0, H - (H - h) / 2, W, (H - h) / 2); }
      g.restore();
    }
    if (this.safe){
      g.save(); g.strokeStyle = "rgba(245,196,81,.8)"; g.lineWidth = 2; g.setLineDash([14, 10]);
      g.strokeRect(W * .05, H * .05, W * .9, H * .9);

  }
};

/* ---------- Stage 3 : Minimap — overview strip with a draggable viewport window (tl-minimap slot) ---------- */
const Minimap = {
  mount(){
    const slot = UI.slot("tl-minimap"); if (!slot) return;
    const cv = this.cv = document.createElement("canvas"); cv.style.cssText = "width:100%;height:100%;display:block;cursor:pointer";
    slot.append(cv);
    let dragging = false;
    const jump = e => { const r = cv.getBoundingClientRect(), d = Ed.duration() || 1;
      const t = Fx.clamp((e.clientX - r.left) / r.width, 0, 1) * d; Tl.scroll.scrollLeft = Math.max(0, t * editorState.ui.zoom - Tl.scroll.clientWidth / 2); };
    cv.addEventListener("pointerdown", e => { dragging = true; cv.setPointerCapture(e.pointerId); jump(e); });
    cv.addEventListener("pointermove", e => dragging && jump(e));
    cv.addEventListener("pointerup", () => dragging = false);
    const redraw = () => requestAnimationFrame(() => this.draw());
    for (const ev of ["state:changed", "selection:changed"]) Bus.on(ev, redraw);
    Tl.scroll.addEventListener("scroll", () => this.draw());
    addEventListener("resize", redraw);
    this.draw();
  },
  draw(){
    const cv = this.cv; if (!cv || !cv.isConnected) return;
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const W = cv.width = Math.round(r.width * devicePixelRatio), H = cv.height = Math.round(r.height * devicePixelRatio);
    const g = cv.getContext("2d"), d = Math.max(Ed.duration(), 1), n = editorState.tracks.length;
    g.clearRect(0, 0, W, H); g.fillStyle = "#12151B"; g.fillRect(0, 0, W, H);
    const rowH = Math.max(2, Math.min(8, H / Math.max(1, n)));
    editorState.tracks.forEach((k, i) => {
      const y = 3 + i * rowH;
      g.fillStyle = k.kind === "audio" ? "#3B5A8C" : "#2B6670";
      for (const c of k.clips){ const x0 = c.start / d * W, w = Math.max(2, (Ed.end(c) - c.start) / d * W);
        g.fillStyle = Sel.ids().includes(c.id) ? "#38C8D8" : (k.kind === "audio" ? "#3B5A8C" : "#2B6670"); g.fillRect(x0, y, w, rowH - 1); }
    });
    const vw = Tl.scroll.clientWidth / editorState.ui.zoom / d * W, vx = Tl.scroll.scrollLeft / editorState.ui.zoom / d * W;
    g.fillStyle = "rgba(232,234,240,.10)"; g.fillRect(vx, 0, vw, H);
    g.strokeStyle = "#F0616D"; g.lineWidth = Math.max(1, devicePixelRatio);
    const px = editorState.currentTime / d * W; g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke();
  }
};

/* ---------- Stage 3 : TrackStats — timeline statistics, duration/density/utilization analysis + smart organization ---------- */
const TrackStats = {
  compute(){
    const dur = Ed.duration(), clips = editorState.tracks.flatMap(k => k.clips);
    const gaps = []; for (const k of editorState.tracks.filter(t => !t.overlay)){ const cs = [...k.clips].sort((a, b) => a.start - b.start); let cur = 0;
      for (const c of cs){ if (c.start > cur + .01) gaps.push({ t: cur, dur: c.start - cur, k: k.name }); cur = Math.max(cur, Ed.end(c)); } }
    const perTrack = editorState.tracks.map(k => { const cd = k.clips.reduce((a, c) => a + (Ed.end(c) - c.start), 0);
      return { name: k.name, kind: k.kind, clips: k.clips.length, clipDur: cd, utilization: dur ? Math.min(100, cd / dur * 100) : 0, density: dur ? k.clips.length / dur * 60 : 0 }; });
    const lens = clips.filter(c => c.mediaId).map(c => Ed.end(c) - c.start);
    return { dur, count: clips.length, overlays: clips.filter(c => Ed.isOv(c)).length,
      gaps, gapDur: gaps.reduce((a, g) => a + g.dur, 0),
      avg: lens.length ? lens.reduce((a, b) => a + b, 0) / lens.length : 0,
      shortest: lens.length ? Math.min(...lens) : 0, longest: lens.length ? Math.max(...lens) : 0,
      perTrack, busiest: perTrack.slice().sort((a, b) => b.utilization - a.utilization)[0],
      cuts: clips.length - editorState.tracks.length };
  },
  dialog(){
    const d = this.dlg ||= Object.assign(document.createElement("dialog"), { id: "dlg-stats" }); if (!d.isConnected) document.body.append(d);
    const s = this.compute();
    const rows = s.perTrack.map(t => `<tr><td>${t.name.replace(/</g, "&lt;")}</td><td class="muted">${t.kind}</td><td>${t.clips}</td><td>${t.clipDur.toFixed(1)}s</td><td>${t.utilization.toFixed(0)}%</td><td>${t.density.toFixed(1)}/min</td></tr>`).join("");
    d.innerHTML = `<header>Timeline statistics <button class="icon" data-close aria-label="Close">✕</button></header><div class="body" style="max-height:64vh;overflow:auto">
      <table class="lut">
        <tr><td class="muted">Total duration</td><td>${fmtDur(s.dur)} (${s.dur.toFixed(2)}s)</td></tr>
        <tr><td class="muted">Clips</td><td>${s.count} (${s.overlays} overlays)</td></tr>
        <tr><td class="muted">Average clip length</td><td>${s.avg.toFixed(2)}s (shortest ${s.shortest.toFixed(2)}s · longest ${s.longest.toFixed(2)}s)</td></tr>
        <tr><td class="muted">Gaps</td><td>${s.gaps.length} totalling ${s.gapDur.toFixed(2)}s</td></tr>
        <tr><td class="muted">Busiest track</td><td>${s.busiest ? s.busiest.name + " — " + s.busiest.utilization.toFixed(0) + "% filled" : "—"}</td></tr>
      </table>
      <table class="lut"><caption>Per-track analysis — utilization = clip time / timeline duration; density = clips per minute</caption>
        <tr><th>Track</th><th>Kind</th><th>Clips</th><th>Clip time</th><th>Utilization</th><th>Density</th></tr>${rows || '<tr><td colspan="6" class="muted">No tracks.</td></tr>'}</table>
      <canvas id="stDensity" width="560" height="90" style="width:100%;background:#0d1216;border-radius:4px"></canvas>
      <p class="capnote">Clip density in 10-second buckets — tall bars are dense sections.</p>
      <div class="fpair"><button id="stOrganize">Smart organize</button><button id="stAutoTracks">Auto-organize tracks</button><button id="stCloseGaps">Close gaps</button></div>
    </div><footer><button data-close>Close</button></footer>`;
    d.onclick = e => { if (e.target.closest("[data-close]")) d.close(); };
    d.querySelector("#stOrganize").onclick = () => { this.organize(); this.dialog(); };
    d.querySelector("#stAutoTracks").onclick = () => { this.autoTracks(); this.dialog(); };
    d.querySelector("#stCloseGaps").onclick = () => { Edits.closeGaps(); this.dialog(); };
    const cv = d.querySelector("#stDensity"), g = cv.getContext("2d");
    g.fillStyle = "#12151B"; g.fillRect(0, 0, cv.width, cv.height);
    const buckets = new Array(Math.max(1, Math.ceil(s.dur / 10))).fill(0);
    for (const c of editorState.tracks.flatMap(k => k.clips)) buckets[Math.min(buckets.length - 1, Math.floor(c.start / 10))]++;
    const mx = Math.max(...buckets, 1), bw = cv.width / buckets.length;
    buckets.forEach((v, i) => { const h = v / mx * (cv.height - 16); g.fillStyle = "#38C8D8"; g.fillRect(i * bw + 1, cv.height - h - 4, Math.max(2, bw - 2), h); });
    d.showModal();
  },
  /* Stage 3: smart timeline organization — frame-snap starts, tidy order, sequential names */
  organize(){
    Hist.run("Smart organize", () => {
      const fr = 1 / editorState.project.fps;
      for (const k of editorState.tracks){ for (const c of k.clips) c.start = Math.max(0, Math.round(c.start / fr) * fr); k.clips.sort((a, b) => a.start - b.start); }
    });
    UI.toast("Clips snapped to whole frames and sorted per track.");
  },
  /* Stage 3: automatic track organization — sort tracks (overlays → video → audio), rename sequentially, move misplaced clips */
  autoTracks(){
    let moved = 0;
    Hist.run("Auto-organize tracks", () => {
      const order = t => t.overlay ? 0 : t.kind === "video" ? 1 : 2;
      editorState.tracks.sort((a, b) => order(a) - order(b));
      let vi = 0, ai = 0, oi = 0;
      for (const t of editorState.tracks){
        if (t.overlay){ ++oi; t.name = oi === 1 ? "Overlay" : "Overlay " + oi; }
        else if (t.kind === "audio") t.name = "Audio " + ++ai;
        else t.name = "Video " + ++vi;
      }
      for (const k of editorState.tracks){                                   // relocate clips whose kind mismatches the track
        if (k.overlay || k.kind !== "video") continue;
        for (const c of [...k.clips]){ const m = editorState.media.find(x => x.id === c.mediaId);
          if (m?.kind === "audio"){ const dst = editorState.tracks.find(t => t.kind === "audio" && !t.locked && !t.overlay);
            if (dst){ k.clips = k.clips.filter(x => x !== c); c.start = Ed.fitStart(dst, c, c.start); dst.clips.push(c); dst.clips.sort((a, b) => a.start - b.start); moved++; } } }
      }
    });
    Bus.emit("state:changed");
    UI.toast(moved ? `Tracks organized — ${moved} audio clip${moved > 1 ? "s" : ""} moved to an audio track.` : "Tracks organized (overlays, video, audio).");
  }
};

/* ---------- Stage 3 : SceneDetect — non-AI cut detection via downscaled frame differencing ---------- */
const SceneDetect = {
  busy: false, cancel: false,
  async analyze(m, onProgress){
    if (this.busy) return UI.toast("A scene analysis is already running.", "warn");
    if (m.kind !== "video") return UI.toast("Scene detection works on video media.", "warn");
    this.busy = true; this.cancel = false;
    const el = document.createElement("video"); el.muted = true; el.playsInline = true; el.preload = "auto"; el.src = m.url;
    const cv = document.createElement("canvas"); cv.width = 64; cv.height = 36;
    const g = cv.getContext("2d", { willReadFrequently: true });
    const cutTimes = [];
    try {
      await new Promise((res, rej) => { el.onloadeddata = res; el.onerror = () => rej(new Error("can't decode")); });
      const stepS = .4, total = Math.floor(m.duration / stepS);
      let prev = null;
      for (let i = 0; i < total && !this.cancel; i++){
        const tt = i * stepS;
        await new Promise(res => { const to = setTimeout(res, 1200); el.onseeked = () => { clearTimeout(to); res(); }; el.currentTime = Math.min(tt, m.duration - .05); });
        g.drawImage(el, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, cur = new Float32Array(768);
        for (let p = 0; p < d.length; p += 4){ const l = d[p] * .3 + d[p + 1] * .59 + d[p + 2] * .11; cur[(p / 4) % 768] = l; }
        if (prev){
          let diff = 0; for (let q = 0; q < 768; q++) diff += Math.abs(cur[q] - prev[q]);
          diff /= 768;
          if (diff > 42) cutTimes.push(+tt.toFixed(2));                     // hard-cut threshold on mean luma delta
        }
        prev = cur;
        if (i % 5 === 0){ onProgress?.(i / total); await new Promise(r => setTimeout(r, 0)); }
      }

    if (this.cancel) return UI.toast("Scene detection cancelled.");
    if (!cuts?.length) return UI.toast("No hard cuts found in " + m.name + ".", "warn", 5000);

};
/* ---------- Stage 3 : Sequences — nested sequences / compound clips, sequence duplication, nested editing ---------- */
const Sequences = {
  all(){ return editorState.project.sequences ||= []; },
  get(id){ return this.all().find(s => s.id === id); },
  draw(g, c, t, W, H){
    const seq = this.get(c.seqId); if (!seq) return;
    const lt = (t - c.start) * (c.speed || 1) + (c.in || 0);
    const rt = this.render(seq, lt, W, H);
    if (!rt) return;
    const T = Play.effTransform(c, t), saveTracks = editorState.tracks;
    editorState.tracks = seq.tracks;                                        // effTransform/keyframes read state — run with the nested tracks
    try {
      const sc2 = T.scale ?? 1, dw = W * sc2, dh = H * sc2;
      g.save();
      g.globalAlpha = Math.max(0, Math.min(1, T.opacity ?? 1));
      g.globalCompositeOperation = T.blend || "source-over";
      g.translate((T.x ?? .5) * W, (T.y ?? .5) * H);
      if (T.rot) g.rotate(T.rot * Math.PI / 180);
      g.scale(T.flipH ? -1 : 1, T.flipV ? -1 : 1);
      g.drawImage(rt, -dw / 2, -dh / 2, dw, dh);
      g.restore();
    } finally { editorState.tracks = saveTracks; }
  },
  render(seq, lt, W, H){
    const buf = this.buf ||= document.createElement("canvas"), g = buf.getContext("2d");
    if (buf.width !== W || buf.height !== H){ buf.width = W; buf.height = H; }
    const save = { tracks: editorState.tracks, ct: editorState.currentTime, sel: editorState.selectedClip, hi: Play.handleInfo };
    editorState.tracks = seq.tracks; editorState.currentTime = lt;
    try {
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      Play.handleInfo = null;
      this.renderInner(g, seq, lt, W, H);
    } finally { Object.assign(editorState, { tracks: save.tracks, currentTime: save.ct }); Play.handleInfo = save.hi; }
    return buf;
  },
  renderInner(g, seq, lt, W, H){
    for (const k of [...seq.tracks].reverse()){
      if (k.hidden) continue;
      for (const c of k.clips){
        if (!(lt >= c.start && lt < Ed.end(c))) continue;
        const m = editorState.media.find(x => x.id === c.mediaId);
        if (c.type === "sequence"){ const s2 = this.get(c.seqId); if (s2) this.drawInner(g, c, lt, W, H, s2); continue; }
        if (!m){ TextFX.draw(g, c, lt); continue; }
        if (m.kind === "audio") continue;
        const e = Play.el(c, m, "seq:"), st = (lt - c.start) * (c.speed || 1) + (c.in || 0);
        if (m.kind === "video" && !Play.playing && e.readyState >= 1 && Math.abs(e.currentTime - st) > .05 && !e.seeking) e.currentTime = st;

  drawInner(g, c, lt, W, H, seq){

  },
  /* Nest: fold the selected media clips into a compound clip */
  nest(){

    if (sel.some(x => x.k.locked)) return UI.toast("Unlock the tracks first.", "warn");

    const hasAudio = sel.some(x => { const m = editorState.media.find(v => v.id === x.c.mediaId); return m?.kind === "audio"; });

        const tr = { ...JSON.parse(JSON.stringify({ ...k, clips: [] })), id: "t" + Math.random().toString(36).slice(2, 8) };
