<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas FX — Editor</title>
<style>
  :root{
    --bg:#0a0d14; --panel:#111722; --panel-2:#171e2c; --panel-3:#1f2838;
    --line:#242e42; --line-2:#323d57;
    --txt:#e8edf7; --muted:#7f8da6; --dim:#4a5468;
    --accent:#5eead4; --accent-2:#818cf8; --danger:#f87171;
    --warn:#fbbf24; --mono:#ffcb6b; --str:#c3e88d; --kw:#c792ea;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242e42;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#323d57}

  .shell{display:grid;grid-template-rows:auto 1fr;height:100vh}

  /* ─── Top bar ─────────────────────────────────── */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;
    letter-spacing:.02em;margin-right:8px}
  .brand .dot{width:9px;height:9px;border-radius:50%;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    box-shadow:0 0 12px rgba(94,234,212,.7)}
  .brand small{color:var(--muted);font-weight:400;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase}
  .btn{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);
    padding:6px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;
    transition:.14s;display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;line-height:1.2}
  .btn:hover{background:var(--panel-3);border-color:#425070}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#06111a;border:none;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .topbar .chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel-2);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px;font-size:11px;
    display:inline-flex;align-items:center;gap:5px}
  .chip b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

  /* ─── Body layout ─────────────────────────────── */
  .body{display:grid;grid-template-columns:380px 1fr 320px;overflow:hidden}

  /* ─── Left: effect browser ────────────────────── */
  .effects-panel{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .panel-head{padding:11px 14px;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--dim);
    border-bottom:1px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;gap:10px}
  .panel-head .stat{font-family:ui-monospace,monospace;color:var(--muted);margin-left:auto}
  .panel-head .btn{text-transform:none;letter-spacing:0}
  .fx-tools{padding:10px 12px 8px;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .fx-search{width:100%;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:8px;padding:6px 10px;font-size:12.5px;outline:none;color:var(--txt)}
  .fx-search:focus{border-color:var(--accent)}
  .cat-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .cat-tabs::-webkit-scrollbar{height:5px}
  .cat-tab{appearance:none;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);border-radius:99px;padding:3px 9px 3px 7px;font-size:11px;
    cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s;
    white-space:nowrap;line-height:1.3}
  .cat-tab:hover{color:var(--txt);border-color:var(--line-2)}
  .cat-tab.active{color:#06111a;background:var(--cat,var(--accent));
    border-color:transparent;font-weight:600}
  .cat-tab .n{font:10px/1 ui-monospace,monospace;opacity:.7}
  .fx-scroll{overflow-y:auto;flex:1;padding:2px 10px 24px}
  .fx-section-head{display:flex;align-items:center;gap:7px;padding:14px 2px 8px;
    cursor:pointer;user-select:none;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted)}
  .fx-section-head:hover{color:var(--txt)}
  .fx-section-head .ico{font-size:13px;letter-spacing:0}
  .fx-section-head .bar{width:3px;height:12px;border-radius:2px;background:var(--cat)}
  .fx-section-head .cnt{font:10px/1 ui-monospace,monospace;color:var(--dim);margin-left:auto}
  .fx-section-head .caret{color:var(--dim);transition:transform .15s;font-size:9px}
  .fx-section.collapsed .caret{transform:rotate(-90deg)}
  .fx-section.collapsed .fx-grid{display:none}
  .fx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

  .fx-card{position:relative;border-radius:10px;overflow:hidden;background:var(--panel-2);
    border:1px solid var(--line);cursor:pointer;
    transition:transform .12s,border-color .12s,box-shadow .12s}
  .fx-card:hover{border-color:var(--cat);transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(0,0,0,.45)}
  .fx-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .fx-card .thumb{position:relative;aspect-ratio:16/9;background:#000}
  .fx-card canvas{display:block;width:100%;height:100%}
  .fx-card .live{position:absolute;left:6px;bottom:6px;display:none;align-items:center;gap:4px;
    font:600 9px/1 ui-monospace,monospace;letter-spacing:.08em;color:#fff;
    background:rgba(5,7,11,.7);padding:3px 6px;border-radius:4px;pointer-events:none}
  .fx-card .live::before{content:"";width:5px;height:5px;border-radius:50%;
    background:#f87171;animation:pulse 1s infinite}
  .fx-card.live-on .live{display:inline-flex}
  @keyframes pulse{50%{opacity:.25}}
  .fx-card .meta{padding:6px 8px 7px;display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
  .fx-card .dot{width:7px;height:7px;border-radius:50%;background:var(--cat);flex-shrink:0}
  .fx-card .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx-card.on .name{color:var(--accent)}
  .fx-card .tag{font:9px/1 ui-monospace,monospace;padding:2px 4px;border-radius:3px;
    background:rgba(129,140,248,.14);color:var(--accent-2)}
  .fx-card .tag.err{background:rgba(248,113,113,.18);color:var(--danger)}
  .fx-card.error{opacity:.65;border-color:#4a2626}
  .fx-toggle{position:absolute;top:6px;right:6px;width:30px;height:17px;border-radius:99px;
    background:rgba(10,13,20,.72);border:1px solid rgba(255,255,255,.18);
    cursor:pointer;padding:0;transition:.14s;backdrop-filter:blur(4px)}
  .fx-toggle::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;
    border-radius:50%;background:#aab4c8;transition:.14s}
  .fx-card.on .fx-toggle{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent}
  .fx-card.on .fx-toggle::after{left:15px;background:#0a0d14}
  .fx-toggle:disabled{opacity:.4;cursor:not-allowed}
  .fx-empty{padding:30px 16px;color:var(--dim);font-size:12px;text-align:center;line-height:1.6}

  /* ─── Center: stage ───────────────────────────── */
  .stage-wrap{display:flex;flex-direction:column;overflow:hidden;
    background:#05070b}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;
    padding:16px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 500px at 50% 30%, #0f1420, #05070b);}
  .stage.dragover{background:#0d1520;
    box-shadow:inset 0 0 0 2px var(--accent-2)}
  .canvas-frame{position:relative;border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;
    max-width:100%;max-height:100%}
  #canvas{display:block;max-width:100%;max-height:calc(100vh - 200px);
    height:auto;width:auto;background:#000}
  .placeholder{position:absolute;inset:16px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    gap:8px;background:rgba(5,7,11,.9);border:1px dashed #2f3850;
    border-radius:8px;color:var(--muted);cursor:pointer;
    transition:.18s;text-align:center;padding:20px;z-index:5}
  .placeholder:hover{border-color:var(--accent);color:var(--accent)}
  .placeholder strong{color:var(--txt);font-size:15px;font-weight:600}
  .placeholder .hint{font-size:12px}
  .placeholder.hidden{display:none}
  .stage-hud{position:absolute;top:26px;left:26px;display:flex;gap:6px;
    pointer-events:none;font:11px/1 ui-monospace,monospace;flex-wrap:wrap}
  .stage-hud span{background:rgba(5,7,11,.78);backdrop-filter:blur(6px);
    padding:4px 8px;border-radius:5px;border:1px solid var(--line);
    color:var(--accent)}
  .stage-hud .warn{color:var(--warn)}

  /* ─── Transport ───────────────────────────────── */
  .transport{display:flex;align-items:center;gap:10px;
    padding:10px 16px;background:var(--panel);
    border-top:1px solid var(--line);flex-shrink:0}
  .transport button{background:transparent;border:none;cursor:pointer;
    padding:6px;border-radius:6px;display:grid;place-items:center;
    color:var(--txt);transition:.14s;flex-shrink:0}
  .transport button:hover{background:var(--panel-3);color:var(--accent)}
  .transport .time{font:12px/1 ui-monospace,monospace;color:var(--muted);
    min-width:46px;text-align:center}
  .transport select{background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
  input[type=range].seek{flex:1;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:99px;background:#2b3448;
    outline:none;cursor:pointer;min-width:100px}
  input[type=range].seek::-webkit-slider-thumb{-webkit-appearance:none;
    width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px rgba(94,234,212,.18)}

  /* ─── Right: settings ─────────────────────────── */
  .settings-panel{background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .settings-scroll{overflow-y:auto;flex:1}
  .empty{padding:60px 24px;text-align:center;color:var(--muted);
    font-size:13px;display:flex;flex-direction:column;gap:8px;
    align-items:center;justify-content:center;height:100%}
  .empty .icon{font-size:40px;opacity:.2}
  .empty h3{color:var(--txt);font-size:14px;font-weight:600;margin:0}
  .empty p{margin:0;font-size:12.5px;max-width:220px}

  .card-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .card-head h2{margin:0 0 4px;font-size:14.5px;font-weight:620;
    letter-spacing:-.005em}
  .card-head .meta{display:flex;gap:6px;flex-wrap:wrap;
    font:10.5px/1.4 ui-monospace,monospace;color:var(--muted)}
  .card-head .meta .pill{background:var(--panel-2);border:1px solid var(--line);
    padding:2px 7px;border-radius:4px}
  .card-head .meta .pill.id{color:var(--accent-2)}
  .card-head .meta .pill.bad{color:var(--danger)}
  .card-body{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}

  .param{display:flex;flex-direction:column;gap:5px}
  .param-top{display:flex;align-items:center;justify-content:space-between;
    gap:10px;font-size:12px}
  .param-top label{color:var(--txt);font-weight:500;font-size:12.5px}
  .param-top output{font:11.5px/1 ui-monospace,monospace;color:var(--accent);
    background:rgba(94,234,212,.08);padding:2px 7px;border-radius:4px}
  .param-row{display:flex;align-items:center;gap:8px}
  .param-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:99px;background:#2b3448;outline:none;
    cursor:pointer}
  .param-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    width:14px;height:14px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px rgba(94,234,212,.18)}
  input[type=color]{width:100%;height:32px;padding:2px;
    border:1px solid var(--line-2);border-radius:7px;
    background:var(--panel-2);cursor:pointer}
  select{width:100%;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:7px;padding:6px 9px;font-size:12.5px;cursor:pointer}

  .error-badge{background:rgba(248,113,113,.1);color:#ffb3b3;
    border:1px solid #4a2626;border-radius:8px;padding:10px 12px;
    font:11.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}

  .shader-source{margin-top:4px;background:#0b1018;border:1px solid var(--line);
    border-radius:8px;overflow:hidden;
    font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  .shader-source summary{cursor:pointer;color:var(--accent);font-size:11.5px;
    padding:9px 12px;list-style:none;border-bottom:1px solid transparent;
    user-select:none}
  .shader-source[open] summary{border-bottom-color:var(--line)}
  .shader-source summary::before{content:"▸ ";display:inline-block;
    transition:.15s;color:var(--dim)}
  .shader-source[open] summary::before{transform:rotate(90deg)}
  .shader-source .code{padding:10px 12px;color:#8fa1bd;white-space:pre;
    overflow-x:auto}
  .shader-source .lnum{color:var(--dim);display:inline-block;
    width:22px;text-align:right;margin-right:10px;user-select:none}
  .shader-source .kw{color:var(--kw)}
  .shader-source .fn{color:#82aaff}
  .shader-source .num{color:#f78c6c}
  .shader-source .cmt{color:var(--dim);font-style:italic}

  /* ─── Toast ───────────────────────────────────── */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line-2);
    padding:10px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;
    pointer-events:none;transition:.2s;max-width:80vw;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.error{border-color:#4a2626;background:#2a1818;color:#ffb3b3}
  .toast.success{border-color:#1e4a3a;background:#122822;color:#a3f0d3}
  .toast.info{border-color:#1e3448;background:#0f1c28;color:#a3d4f0}

  @media (max-width:1000px){
    .body{grid-template-columns:330px 1fr 280px}
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ══════════════ TOP BAR ══════════════ -->
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      Canvas FX
      <small>editor</small>
    </div>
    <label class="btn primary">
      📁 Load video
      <input type="file" id="videoFile" accept="video/*" hidden>
    </label>
    <label class="btn">
      ⌘ Load pack
      <input type="file" id="packFile" accept=".json,application/json" hidden>
    </label>
    <button class="btn" id="snapBtn" title="Save current frame as PNG">◲ Snapshot</button>
    <div class="chips" id="chips"></div>
  </header>

  <!-- ══════════════ BODY ══════════════ -->
  <div class="body">

    <!-- Left: effect list -->
    <aside class="effects-panel">
      <div class="panel-head">
        <span>Effects</span>
        <span class="stat" id="fxStat">—</span>
        <button class="btn sm" id="allOff" title="Disable every effect">All off</button>
      </div>
      <div class="fx-tools">
        <input type="search" class="fx-search" id="fxSearch" placeholder="Search effects…" autocomplete="off">
        <div class="cat-tabs" id="catTabs"></div>
      </div>
      <div class="fx-scroll" id="fxList"></div>
    </aside>

    <!-- Center: stage -->
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <div class="canvas-frame">
          <canvas id="canvas" width="720" height="405"></canvas>
        </div>
        <div class="stage-hud" id="hud">
          <span id="hudRes">— × —</span>
          <span id="hudFps">— fps</span>
          <span id="hudEffects">0 active</span>
        </div>
        <div class="placeholder" id="placeholder">
          <strong>Drop a video here</strong>
          <span class="hint">MP4 / WebM / MOV — or click to browse</span>
          <span class="hint" style="color:var(--dim);margin-top:6px;font-size:11.5px">
            No effects are built in — drop an effects <b>.json</b> pack too, or use <b>Load pack</b>
          </span>
        </div>
      </div>

      <!-- Transport -->
      <div class="transport">
        <button id="playBtn" title="Play / Pause (Space)">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button id="backBtn" title="-5s">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
          </svg>
        </button>
        <button id="fwdBtn" title="+5s">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 6v12l8.5-6L13 6zM4 18l8.5-6L4 6v12z"/>
          </svg>
        </button>
        <span class="time" id="timeCur">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="1000" value="0">
        <span class="time" id="timeDur">0:00</span>
        <select id="rateSel" title="Playback speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </section>

    <!-- Right: settings -->
    <aside class="settings-panel">
      <div class="panel-head">
        <span>Parameters</span>
        <span class="stat" id="settingsStat">—</span>
      </div>
      <div class="settings-scroll" id="settingsScroll">
        <div class="empty">
          <div class="icon">⌘</div>
          <h3>No effect selected</h3>
          <p>Click any effect on the left to edit its parameters.</p>
        </div>
      </div>
    </aside>

  </div>
</div>

<video id="video" playsinline muted loop style="display:none"></video>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CANVAS FX EDITOR RUNTIME
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

const $ = id => document.getElementById(id);
const video = $('video');
const canvas = $('canvas');
const ctx = canvas.getContext('2d', {alpha:false});
const stage = $('stage');
const placeholder = $('placeholder');

/* ─── Canvas size (fixed 16:9, upscaled to fit) ─── */
const W = 720, H = 405;
canvas.width = W; canvas.height = H;

/* ─── Offscreen buffers for ping-pong ─── */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
const buf1 = makeCanvas(W, H), buf1Ctx = buf1.getContext('2d', {alpha:false, willReadFrequently:true});
const buf2 = makeCanvas(W, H), buf2Ctx = buf2.getContext('2d', {alpha:false, willReadFrequently:true});
const srcBuf = makeCanvas(W, H), srcBufCtx = srcBuf.getContext('2d', {alpha:false, willReadFrequently:true});

/* ═══════════════════════════════════════════════════════════════
   1. EXPRESSION EVALUATOR — for display format strings only
   ═══════════════════════════════════════════════════════════════ */
function evalFormat(expr, scope){
  try {
    scope = Object.assign({ round:Math.round, floor:Math.floor, ceil:Math.ceil,
      abs:Math.abs, min:Math.min, max:Math.max, pow:Math.pow, sqrt:Math.sqrt }, scope);
    const keys = Object.keys(scope);
    const vals = keys.map(k => scope[k]);
    const fn = new Function(...keys, `"use strict"; return (${expr});`);
    return fn(...vals);
  } catch(_){ return null; }
}

/* ═══════════════════════════════════════════════════════════════
   2. SHADER LANGUAGE — Lexer, Parser, Codegen
   ═══════════════════════════════════════════════════════════════ */
function tokenize(src){
  const out = [];
  let i = 0;
  const isDigit = c => c >= '0' && c <= '9';
  const isAlpha = c => /[a-zA-Z_]/.test(c);
  const isAlnum = c => /[a-zA-Z0-9_]/.test(c);
  while (i < src.length){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '/' && src[i+1] === '/'){
      while (i < src.length && src[i] !== '\n') i++;
      continue;
    }
    if (c === '/' && src[i+1] === '*'){
      i += 2;
      while (i < src.length && !(src[i] === '*' && src[i+1] === '/')) i++;
      i += 2; continue;
    }
    if (isDigit(c) || (c === '.' && isDigit(src[i+1]))){
      let j = i, dot = false;
      while (j < src.length && (isDigit(src[j]) || (src[j] === '.' && !dot))){
        if (src[j] === '.') dot = true;
        j++;
      }
      out.push({ k:'num', v: parseFloat(src.slice(i, j)) });
      i = j; continue;
    }
    if (isAlpha(c)){
      let j = i;
      while (j < src.length && isAlnum(src[j])) j++;
      out.push({ k:'id', v: src.slice(i, j) });
      i = j; continue;
    }
    const two = src.slice(i, i+2);
    if (['<=','>=','==','!='].includes(two)){
      out.push({ k:'op', v: two }); i += 2; continue;
    }
    if ('+-*/%()<>=?:,.;[]{}!'.includes(c)){
      out.push({ k:'op', v: c }); i++; continue;
    }
    throw new Error(`Unexpected character "${c}" at position ${i}`);
  }
  return out;
}

function parseShader(source){
  const toks = tokenize(source);
  let pos = 0;
  const peek = (n=0) => toks[pos + n];
  const next = () => toks[pos++];
  const eat = v => { if (peek() && peek().v === v){ pos++; return true; } return false; };
  const expect = v => {
    if (!eat(v)) throw new Error(`Expected "${v}"${peek() ? ` near "${peek().v}"` : ''}`);
  };
  const isKw = v => peek() && peek().k === 'id' && peek().v === v;
  const declaredVars = new Set();

  function parseExpr(){ return parseTernary(); }
  function parseTernary(){
    const c = parseOr();
    if (eat('?')){
      const a = parseTernary();
      expect(':');
      const b = parseTernary();
      return { t:'tern', c, a, b };
    }
    return c;
  }
  function parseOr(){
    let l = parseAnd();
    while (eat('||')) l = { t:'bin', op:'||', l, r: parseAnd() };
    return l;
  }
  function parseAnd(){
    let l = parseCmp();
    while (eat('&&')) l = { t:'bin', op:'&&', l, r: parseCmp() };
    return l;
  }
  function parseCmp(){
    let l = parseAdd();
    while (peek() && ['<','>','<=','>=','==','!='].includes(peek().v)){
      const op = next().v;
      l = { t:'bin', op, l, r: parseAdd() };
    }
    return l;
  }
  function parseAdd(){
    let l = parseMul();
    while (peek() && (peek().v === '+' || peek().v === '-')){
      const op = next().v;
      l = { t:'bin', op, l, r: parseMul() };
    }
    return l;
  }
  function parseMul(){
    let l = parseUnary();
    while (peek() && ['*','/','%'].includes(peek().v)){
      const op = next().v;
      l = { t:'bin', op, l, r: parseUnary() };
    }
    return l;
  }
  function parseUnary(){
    if (peek() && (peek().v === '-' || peek().v === '!')){
      const op = next().v;
      return { t:'un', op, arg: parseUnary() };
    }
    return parsePostfix();
  }
  function parsePostfix(){
    let n = parsePrimary();
    while (true){
      if (eat('.')){
        const prop = next();
        if (!prop || prop.k !== 'id') throw new Error('Expected property after "."');
        n = { t:'member', obj: n, prop: prop.v };
      } else break;
    }
    return n;
  }
  function parsePrimary(){
    const tk = next();
    if (!tk) throw new Error('Unexpected end of source');
    if (tk.k === 'num') return { t:'num', v: tk.v };
    if (tk.k === 'id'){
      if (eat('(')){
        const args = [];
        if (!eat(')')){
          args.push(parseExpr());
          while (eat(',')) args.push(parseExpr());
          expect(')');
        }
        return { t:'call', name: tk.v, args };
      }
      return { t:'id', name: tk.v };
    }
    if (tk.v === '('){ const e = parseExpr(); expect(')'); return e; }
    throw new Error(`Unexpected token "${tk.v}"`);
  }

  function parseBlock(){
    expect('{');
    const stmts = [];
    while (peek() && peek().v !== '}') stmts.push(parseStmt());
    expect('}');
    return stmts;
  }
  function parseStmt(){
    if (isKw('let')){
      next();
      const name = next();
      if (!name || name.k !== 'id') throw new Error('Expected variable name');
      declaredVars.add(name.v);
      expect('=');
      const expr = parseExpr();
      expect(';');
      return { t:'decl', name: name.v, expr };
    }
    if (isKw('return')){
      next();
      const expr = parseExpr();
      expect(';');
      return { t:'return', expr };
    }
    if (isKw('if')){
      next();
      expect('(');
      const cond = parseExpr();
      expect(')');
      const thenB = parseBlock();
      let elseB = null;
      if (isKw('else')){
        next();
        elseB = isKw('if') ? [parseStmt()] : parseBlock();
      }
      return { t:'if', cond, then: thenB, else: elseB };
    }
    if (isKw('for')){
      next();
      expect('(');
      let init = null;
      if (isKw('let')){
        next();
        const name = next();
        if (!name || name.k !== 'id') throw new Error('Expected variable name');
        declaredVars.add(name.v);
        expect('=');
        init = { t:'decl', name: name.v, expr: parseExpr() };
      } else {
        init = parseStmtExpr(false);
      }
      expect(';');
      const cond = parseExpr();
      expect(';');
      const update = parseStmtExpr(false);
      expect(')');
      const body = parseBlock();
      return { t:'for', init, cond, update, body };
    }
    if (peek() && peek().v === '{') return { t:'block', body: parseBlock() };
    return parseStmtExpr();
  }
  function parseStmtExpr(requireSemi = true){
    const save = pos;
    const first = peek();
    if (first && first.k === 'id'){
      const nxt = peek(1);
      if (nxt && nxt.v === '=' && !(peek(2) && peek(2).v === '=')){
        next(); next();
        const name = first.v;
        const expr = parseExpr();
        if (requireSemi) expect(';');
        return { t:'assign', name, expr };
      }
    }
    pos = save;
    const expr = parseExpr();
    if (requireSemi) expect(';');
    return { t:'expr', expr };
  }

  const stmts = [];
  while (pos < toks.length) stmts.push(parseStmt());
  return { stmts, declaredVars };
}

const BUILTIN_FNS = new Set([
  'sin','cos','tan','asin','acos','atan','atan2',
  'abs','floor','ceil','round','sqrt','pow','min','max',
  'sign','mod','random','clamp','lerp','mix','step','smoothstep',
  'rgb','rgba','hsv','sample','sampleA','sampleB','mixRGBA','length',
]);
const ENV_NAMES = new Set(['x','y','u','v','w','h','time','frame','pi','progress']);

function generateJS(ast, paramNames){
  const paramSet = new Set(paramNames);
  const declaredVars = ast.declaredVars;
  const isKnown = name =>
    declaredVars.has(name) || paramSet.has(name) || ENV_NAMES.has(name) || BUILTIN_FNS.has(name);
  const mapId = name => {
    if (!isKnown(name)) throw new Error(`Unknown identifier "${name}"`);
    return declaredVars.has(name) ? '_v_' + name : name;
  };

  function emit(e){
    switch (e.t){
      case 'num': return String(e.v);
      case 'id': return mapId(e.name);
      case 'member': {
        const obj = emit(e.obj), p = e.prop;
        if (p === 'r' || p === 'x') return `(${obj})[0]`;
        if (p === 'g' || p === 'y') return `(${obj})[1]`;
        if (p === 'b' || p === 'z') return `(${obj})[2]`;
        if (p === 'a' || p === 'w') return `(${obj})[3]`;
        throw new Error(`Unknown property ".${p}"`);
      }
      case 'un': {
        const a = emit(e.arg);
        return e.op === '-' ? `(-(${a}))` : `((${a}) ? 0 : 1)`;
      }
      case 'bin': {
        const a = emit(e.l), b = emit(e.r);
        if (e.op === '&&') return `((${a}) && (${b}) ? 1 : 0)`;
        if (e.op === '||') return `((${a}) || (${b}) ? 1 : 0)`;
        if (['<','>','<=','>=','==','!='].includes(e.op))
          return `((${a}) ${e.op} (${b}) ? 1 : 0)`;
        return `((${a}) ${e.op} (${b}))`;
      }
      case 'tern': return `((${emit(e.c)}) ? (${emit(e.a)}) : (${emit(e.b)}))`;
      case 'call': {
        if (!BUILTIN_FNS.has(e.name))
          throw new Error(`Unknown function "${e.name}"`);
        return `_rt_${e.name}(${e.args.map(emit).join(', ')})`;
      }
    }
    throw new Error('Cannot emit ' + e.t);
  }

  function emitStmt(s, ind){
    const pad = '  '.repeat(ind);
    switch (s.t){
      case 'decl':   return `${pad}let _v_${s.name} = ${emit(s.expr)};\n`;
      case 'assign':
        if (!declaredVars.has(s.name))
          throw new Error(`Undeclared variable "${s.name}" — use "let" first`);
        return `${pad}_v_${s.name} = ${emit(s.expr)};\n`;
      case 'return': return `${pad}_out = _rt_toRGBA(${emit(s.expr)}); break _pixel;\n`;
      case 'expr':   return `${pad}${emit(s.expr)};\n`;
      case 'if': {
        let out = `${pad}if (${emit(s.cond)}) {\n`;
        out += s.then.map(st => emitStmt(st, ind+1)).join('');
        out += `${pad}}`;
        if (s.else){
          out += ` else {\n`;
          out += s.else.map(st => emitStmt(st, ind+1)).join('');
          out += `${pad}}`;
        }
        return out + '\n';
      }
      case 'for': {
        const init = s.init ? emitStmt(s.init, 0).trim().replace(/;$/, '') : '';
        const update = s.update.t === 'assign'
          ? `_v_${s.update.name} = ${emit(s.update.expr)}`
          : emit(s.update.expr);
        let out = `${pad}for (${init}; ${emit(s.cond)}; ${update}) {\n`;
        out += s.body.map(st => emitStmt(st, ind+1)).join('');
        out += `${pad}}\n`;
        return out;
      }
      case 'block':
        return pad + '{\n' + s.body.map(st => emitStmt(st, ind+1)).join('') + pad + '}\n';
    }
    throw new Error('Cannot emit ' + s.t);
  }

  return ast.stmts.map(s => emitStmt(s, 2)).join('');
}

const COMPILE_CACHE = new Map();

function compileShader(effect){
  const source = Array.isArray(effect.def.render.source)
    ? effect.def.render.source.join('\n')
    : String(effect.def.render.source);
  const cacheKey = effect.def.id + ':' + JSON.stringify((effect.def.params || []).map(p => [p.key, p.type])) + ':' + source;
  if (COMPILE_CACHE.has(cacheKey)) return COMPILE_CACHE.get(cacheKey);

  const ast = parseShader(source);
  const paramDefs = effect.def.params || [];
  const paramNames = [];
  paramDefs.forEach(p => {
    paramNames.push(p.key);
    if (p.type === 'color') ['r','g','b'].forEach(c => paramNames.push(p.key + '_' + c));
  });
  const paramLines = paramDefs.map(p => {
    let s = `const ${p.key} = params[${JSON.stringify(p.key)}];`;
    if (p.type === 'color')
      s += ['r','g','b'].map((c, i) => `\n    const ${p.key}_${c} = _hex(params[${JSON.stringify(p.key)}], ${i});`).join('');
    return s;
  });
  const body = generateJS(ast, paramNames);

  const template = `
    "use strict";
    const w = env.w, h = env.h;
    const time = env.time, frame = env.frame;
    const pi = Math.PI;

    const _src = input.data;
    const _img = output.data;

    const _rt_sample = (sx, sy) => {
      let ix = sx | 0, iy = sy | 0;
      if (ix < 0) ix = 0; else if (ix >= w) ix = w - 1;
      if (iy < 0) iy = 0; else if (iy >= h) iy = h - 1;
      const i = (iy * w + ix) * 4;
      return [_src[i], _src[i+1], _src[i+2], _src[i+3]];
    };
    const _rt_rgb  = (r, g, b) => [r, g, b, 255];
    const _rt_rgba = (r, g, b, a) => [r, g, b, a === undefined ? 255 : a];
    const _rt_hsv = (hDeg, s, v) => {
      const hh = ((hDeg % 360) + 360) % 360 / 60;
      const c = v * s;
      const xx = c * (1 - Math.abs(hh % 2 - 1));
      const mm = v - c;
      let r, g, b;
      if (hh < 1) { r = c; g = xx; b = 0; }
      else if (hh < 2) { r = xx; g = c; b = 0; }
      else if (hh < 3) { r = 0; g = c; b = xx; }
      else if (hh < 4) { r = 0; g = xx; b = c; }
      else if (hh < 5) { r = xx; g = 0; b = c; }
      else { r = c; g = 0; b = xx; }
      return [(r + mm) * 255, (g + mm) * 255, (b + mm) * 255, 255];
    };
    const _rt_sin = Math.sin, _rt_cos = Math.cos, _rt_tan = Math.tan;
    const _rt_asin = Math.asin, _rt_acos = Math.acos;
    const _rt_atan = Math.atan, _rt_atan2 = Math.atan2;
    const _rt_abs = Math.abs, _rt_floor = Math.floor, _rt_ceil = Math.ceil;
    const _rt_round = Math.round, _rt_sqrt = Math.sqrt, _rt_pow = Math.pow;
    const _rt_min = Math.min, _rt_max = Math.max, _rt_sign = Math.sign;
    const _rt_mod = (a, b) => ((a % b) + b) % b;
    const _rt_random = (a, b) => a === undefined ? Math.random() : a + Math.random() * (b - a);
    const _rt_clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
    const _rt_lerp = (a, b, t) => a + (b - a) * t;
    const _rt_mix = _rt_lerp;
    const _rt_step = (e, x) => x < e ? 0 : 1;
    const _rt_smoothstep = (e0, e1, x) => {
      const t = _rt_clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };
    const _rt_length = v => Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
    const _rt_toRGBA = v => Array.isArray(v) ? v : [v, v, v, 255];

    /* params */
    const _hex = (s, i) => parseInt(String(s).slice(1 + i * 2, 3 + i * 2), 16) || 0;
    ${paramLines.join('\n    ')}

    /* pixel loop */
    for (let y = 0; y < h; y++){
      const v = y / h;
      for (let x = 0; x < w; x++){
        const u = x / w;
        let _out = null;
        _pixel: {
${body}
        }
        if (!_out) _out = _rt_sample(x, y);
        const oi = (y * w + x) * 4;
        let r = _out[0] | 0, g = _out[1] | 0, b = _out[2] | 0;
        let a = _out[3] === undefined ? 255 : _out[3] | 0;
        _img[oi]     = r < 0 ? 0 : r > 255 ? 255 : r;
        _img[oi + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
        _img[oi + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
        _img[oi + 3] = a < 0 ? 0 : a > 255 ? 255 : a;
      }
    }
  `;

  const fn = new Function('env', 'params', 'input', 'output', template);
  COMPILE_CACHE.set(cacheKey, fn);
  return fn;
}

/* ═══════════════════════════════════════════════════════════════
   3. REGISTRY
   ═══════════════════════════════════════════════════════════════ */
function titleCase(s){
  return String(s).replace(/[_-]+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

const registry = {
  effects: [],
  categories: new Map(),   /* id -> {id,label,icon,color,description}; insertion order = display order */
  selectedId: null,
  _batch: false,
  _l: { structure: [], state: [], select: [] },
  on(kind, fn){ this._l[kind].push(fn); },
  emit(kind = 'structure'){
    if (this._batch) return;
    this._l[kind].forEach(fn => { try { fn(); } catch(e){ console.error(e); } });
  },

  defineCategory(c){
    if (!c || !c.id) return;
    this.categories.set(c.id, {
      id: c.id, label: c.label || titleCase(c.id), icon: c.icon || '•',
      color: c.color || '#7f8da6', description: c.description || ''
    });
  },

  add(def){
    if (!def.id) throw new Error('Effect requires "id"');
    if (!def.name) throw new Error(`Effect "${def.id}" requires "name"`);
    if (!def.render) throw new Error(`Effect "${def.id}" requires "render"`);
    if (this.effects.find(e => e.def.id === def.id))
      throw new Error(`Effect "${def.id}" already registered`);

    const category = def.category || 'misc';
    if (!this.categories.has(category)) this.defineCategory({ id: category });

    const values = {};
    const params = def.params || [];
    params.forEach(p => { values[p.key] = p.default; });

    const srcText = Array.isArray(def.render.source) ? def.render.source.join('\n') : String(def.render.source || '');
    const fx = {
      def, params, values, category,
      enabled: false,
      animated: /\btime\b/.test(srcText),
      _compiled: null,
      compileError: null,
    };

    if (def.render.kind === 'shader'){
      try { fx._compiled = compileShader(fx); }
      catch (e){ fx.compileError = e.message; }
    } else {
      fx.compileError = `Unsupported render kind: ${def.render.kind}`;
    }

    this.effects.push(fx);
    this.emit('structure');
    return fx;
  },

  remove(id){
    const i = this.effects.findIndex(e => e.def.id === id);
    if (i < 0) return;
    this.effects.splice(i, 1);
    if (this.selectedId === id) this.selectedId = null;
    this.emit('structure');
  },

  get(id){ return this.effects.find(e => e.def.id === id); },
  get selected(){ return this.selectedId ? this.get(this.selectedId) : null; },
  select(id){ this.selectedId = id; this.emit('select'); },
  clear(){ this.effects.length = 0; this.selectedId = null; this.emit('structure'); },
};

/* ═══════════════════════════════════════════════════════════════
   4. PACK LOADER
   ═══════════════════════════════════════════════════════════════ */
function loadPack(raw, name){
  let data;
  try { data = typeof raw === 'string' ? JSON.parse(raw) : raw; }
  catch (e){ toast('Invalid JSON: ' + e.message, 'error'); return; }

  const list = Array.isArray(data) ? data : (data.effects || []);
  if (!Array.isArray(list)){ toast('Pack has no "effects" array', 'error'); return; }

  let added = 0, failed = 0;
  const errors = [];
  registry._batch = true;
  try {
    if (Array.isArray(data.categories)) data.categories.forEach(c => registry.defineCategory(c));
    list.forEach(def => {
      try {
        const prev = def && registry.get(def.id);
        const wasOn = prev ? prev.enabled : false;
        const wasSel = prev ? registry.selectedId === def.id : false;
        if (prev) registry.remove(def.id);
        const fx = registry.add(def);
        if (prev && !fx.compileError) fx.enabled = wasOn;
        if (wasSel) registry.selectedId = def.id;
        added++;
      }
      catch (e){ failed++; errors.push((def && def.id) + ': ' + e.message); }
    });
  } finally { registry._batch = false; }
  registry.emit('structure');
  if (errors.length) console.warn('[CanvasFX] Pack errors:', errors);

  toast(`Loaded ${added} effect${added === 1 ? '' : 's'}` +
        (failed ? ` (${failed} failed)` : '') +
        ` from ${data.meta?.name || name || 'pack'}`,
        added ? 'success' : 'error');
}

const TW = 320, TH = 180;               /* card canvas resolution */
let activeCat = 'all';                  /* 'all' | 'active' | category id */
let filterText = '';
const collapsed = new Set();
const cardEls = new Map();              /* id -> { el, ctx } */
const visibleCards = new Set();

const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const id = en.target.dataset.id;
    if (en.isIntersecting) visibleCards.add(id); else visibleCards.delete(id);
  });
}, { root: fxList, rootMargin: '100px' });

function catOf(fx){ return registry.categories.get(fx.category) || { id: fx.category, label: titleCase(fx.category), icon: '•', color: '#7f8da6' }; }

function matchesFilter(fx, q){
  if (activeCat === 'active' && !fx.enabled) return false;
  if (activeCat !== 'all' && activeCat !== 'active' && fx.category !== activeCat) return false;
  if (!q) return true;
  const hay = (fx.def.name + ' ' + fx.def.id + ' ' + (fx.def.description || '') + ' ' + catOf(fx).label).toLowerCase();
  return q.split(/\s+/).every(tok => hay.includes(tok));
}

function renderTabs(){
  catTabs.innerHTML = '';
  if (!registry.effects.length) return;
  const mk = (id, icon, label, count, color) => {
    const b = document.createElement('button');
    b.className = 'cat-tab' + (activeCat === id ? ' active' : '');
    if (color) b.style.setProperty('--cat', color);
    b.innerHTML = `<span>${escapeHtml(icon)}</span><span>${escapeHtml(label)}</span><span class="n">${count}</span>`;
    b.addEventListener('click', () => { activeCat = id; renderTabs(); renderList(); });
    catTabs.appendChild(b);
  };
  mk('all', '▦', 'All', registry.effects.length);
  mk('active', '●', 'Active', registry.effects.filter(f => f.enabled).length);
  registry.categories.forEach(cat => {
    const n = registry.effects.filter(f => f.category === cat.id).length;
    if (n) mk(cat.id, cat.icon, cat.label, n, cat.color);
  });
}

function buildCard(fx){
  const id = fx.def.id;
  const card = document.createElement('div');
  card.className = 'fx-card';
  card.dataset.id = id;
  card.style.setProperty('--cat', catOf(fx).color);
  card.title = (fx.def.description || fx.def.name) + (fx.compileError ? '\n⚠ ' + fx.compileError : '');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const cctx = cv.getContext('2d', { alpha: false });
  cctx.fillStyle = '#05070b'; cctx.fillRect(0, 0, TW, TH);
  thumb.appendChild(cv);

  const live = document.createElement('span');
  live.className = 'live'; live.textContent = 'LIVE';
  thumb.appendChild(live);

  const toggle = document.createElement('button');
  toggle.className = 'fx-toggle';
  toggle.title = fx.compileError || 'Enable / disable';
  if (fx.compileError) toggle.disabled = true;
  toggle.addEventListener('click', e => {
    e.stopPropagation();
    if (fx.compileError) return;
    fx.enabled = !fx.enabled;
    registry.emit('state');
  });
  thumb.appendChild(toggle);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span class="dot"></span><span class="name">${escapeHtml(fx.def.name)}</span>` +
    (fx.compileError ? '<span class="tag err">!</span>' : (fx.animated ? '<span class="tag" title="Animated">~</span>' : ''));

  card.append(thumb, meta);

  card.addEventListener('click', () => registry.select(id));
  card.addEventListener('dblclick', () => {
    if (fx.compileError) return;
    fx.enabled = !fx.enabled; registry.emit('state');
  });
  card.addEventListener('mouseenter', () => {
    hoverId = id;
    if (!fx.compileError) card.classList.add('live-on');
  });
  card.addEventListener('mouseleave', () => {
    if (hoverId === id) hoverId = null;
    card.classList.remove('live-on');
    cctx.drawImage(srcBuf, 0, 0, TW, TH);      /* back to plain source frame */
  });

  cardEls.set(id, { el: card, ctx: cctx });
  return card;
}

function renderList(){
  io.disconnect();
  visibleCards.clear();
  cardEls.clear();
  hoverId = null;
  fxList.innerHTML = '';

  const total = registry.effects.length;
  if (!total){
    fxStat.textContent = '0';
    fxList.innerHTML = `<div class="fx-empty">No effects loaded.<br>Drop an effects <b>.json</b> pack on the stage<br>or click <b>Load pack</b>.</div>`;
    return;
  }

  const q = filterText.trim().toLowerCase();
  let shown = 0;
  registry.categories.forEach(cat => {
    const items = registry.effects.filter(fx => fx.category === cat.id && matchesFilter(fx, q));
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement('section');
    sec.className = 'fx-section' + (collapsed.has(cat.id) && !q ? ' collapsed' : '');
    sec.style.setProperty('--cat', cat.color);

    const head = document.createElement('div');
    head.className = 'fx-section-head';
    head.title = cat.description || '';
    head.innerHTML = `<span class="bar"></span><span class="ico">${escapeHtml(cat.icon)}</span>` +
      `<span>${escapeHtml(cat.label)}</span><span class="cnt">${items.length}</span><span class="caret">▼</span>`;
    head.addEventListener('click', () => {
      sec.classList.toggle('collapsed');
      if (sec.classList.contains('collapsed')) collapsed.add(cat.id); else collapsed.delete(cat.id);
    });

    const grid = document.createElement('div');
    grid.className = 'fx-grid';
    items.forEach(fx => grid.appendChild(buildCard(fx)));

    sec.append(head, grid);
    fxList.appendChild(sec);
  });

  fxStat.textContent = (shown === total ? total : shown + ' / ' + total);
  if (!shown){
    fxList.innerHTML = `<div class="fx-empty">No effects match${q ? ' “' + escapeHtml(filterText) + '”' : ''}.</div>`;
    return;
  }
  cardEls.forEach(c => io.observe(c.el));
  updateCards();
}

function updateCards(){
  cardEls.forEach((c, id) => {
    const fx = registry.get(id);
    if (!fx) return;
    c.el.classList.toggle('on', !!fx.enabled);
    c.el.classList.toggle('selected', registry.selectedId === id);
    c.el.classList.toggle('error', !!fx.compileError);
  });
}

catTabs.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ catTabs.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
fxSearch.addEventListener('input', () => { filterText = fxSearch.value; renderList(); });

/* Card previews, called from the render loop (section 9) */
const previewBuf = makeCanvas(W, H);
const previewCtx = previewBuf.getContext('2d', { alpha: false });
const previewOut = new ImageData(W, H);
let lastThumbDraw = 0;

function drawCardPreviews(now, frame){
  /* 1. The hovered card gets the effect applied live to the current source frame */
  if (hoverId){
    const fx = registry.get(hoverId), c = cardEls.get(hoverId);
    if (fx && c && fx._compiled){
      try {
        const inData = srcBufCtx.getImageData(0, 0, W, H);
        fx._compiled({ w: W, h: H, time: now / 1000, frame }, fx.values, inData, previewOut);
        previewCtx.putImageData(previewOut, 0, 0);
        c.ctx.drawImage(previewBuf, 0, 0, TW, TH);
      } catch (e){
        console.warn('Preview error in', fx.def.id, e);
        fx.compileError = 'Runtime: ' + e.message; fx._compiled = null;
        hoverId = null;
        registry.emit('structure');
        return;
      }
    }
  }
  /* 2. Other visible cards show the plain source frame, refreshed ~5×/s */
  if (now - lastThumbDraw > 200){
    lastThumbDraw = now;
    visibleCards.forEach(id => {
      if (id === hoverId) return;
      const c = cardEls.get(id);
      if (c) c.ctx.drawImage(srcBuf, 0, 0, TW, TH);
    });
  }
}

function renderSettings(){
  const fx = registry.selected;
  if (!fx){
    settingsStat.textContent = '—';
    settingsScroll.innerHTML = `
      <div class="empty">
        <div class="icon">⌘</div>
        <h3>No effect selected</h3>
        <p>Click any effect on the left to edit its parameters.</p>
      </div>`;
    return;
  }

  settingsStat.textContent = fx.def.id;
  settingsScroll.innerHTML = '';

  /* Head */
  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <h2>${escapeHtml(fx.def.name)}</h2>
    <div class="meta">
      <span class="pill id">${escapeHtml(fx.def.id)}</span>
      <span class="pill">${escapeHtml(catOf(fx).icon + ' ' + catOf(fx).label)}</span>
      ${fx._compiled ? '<span class="pill">compiled</span>' : ''}
      ${fx.compileError ? '<span class="pill bad">error</span>' : ''}
    </div>`;
  if (fx.def.description){
    const d = document.createElement('div');
    d.style.cssText = 'color:var(--muted);font-size:12px;line-height:1.55;margin-top:8px';
    d.textContent = fx.def.description;
    head.appendChild(d);
  }
  settingsScroll.appendChild(head);

  /* Body */
  const body = document.createElement('div');
  body.className = 'card-body';

  if (fx.compileError){
    const err = document.createElement('div');
    err.className = 'error-badge';
    err.textContent = '⚠ Compile error\n' + fx.compileError;
    body.appendChild(err);
  }

  if (fx.params.length === 0){
    const note = document.createElement('div');
    note.style.cssText = 'color:var(--muted);font-size:12px;text-align:center;padding:10px';
    note.textContent = 'No parameters.';
    body.appendChild(note);
  } else {
    fx.params.forEach(p => body.appendChild(buildParamControl(fx, p)));
  }

  /* Shader source */
  if (fx.def.render && fx.def.render.source){
    const src = Array.isArray(fx.def.render.source)
      ? fx.def.render.source.join('\n')
      : String(fx.def.render.source);
    const lines = src.split('\n');
    const details = document.createElement('details');
    details.className = 'shader-source';
    details.innerHTML = `<summary>View shader source (${lines.length} lines)</summary>
      <div class="code">${lines.map((l, i) =>
        `<span class="lnum">${String(i+1).padStart(2,' ')}</span>${
          highlightShader(l)
        }`).join('\n')}</div>`;
    body.appendChild(details);
  }

  settingsScroll.appendChild(body);
}

function buildParamControl(fx, p){
  const wrap = document.createElement('div');
  wrap.className = 'param';

  const top = document.createElement('div');
  top.className = 'param-top';
  const label = document.createElement('label');
  label.textContent = p.label || p.key;
  const out = document.createElement('output');
  out.textContent = formatValue(fx, p, fx.values[p.key]);
  top.append(label, out);
  wrap.appendChild(top);

  const row = document.createElement('div');
  row.className = 'param-row';
  let input;

  if (p.type === 'color'){
    input = document.createElement('input');
    input.type = 'color';
    input.value = fx.values[p.key] || '#ffffff';
    out.style.display = 'none';
    input.addEventListener('input', () => {
      fx.values[p.key] = input.value;
    });
  } else if (p.type === 'select'){
    input = document.createElement('select');
    (p.options || []).forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.value;
      opt.textContent = o.label ?? String(o.value);
      if (o.value === fx.values[p.key]) opt.selected = true;
      input.appendChild(opt);
    });
    out.style.display = 'none';
    input.addEventListener('change', () => {
      const raw = input.value;
      const n = parseFloat(raw);
      fx.values[p.key] = isNaN(n) ? raw : n;
    });
  } else if (p.type === 'toggle'){
    input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!fx.values[p.key];
    out.style.display = 'none';
    input.addEventListener('change', () => {
      fx.values[p.key] = input.checked;
    });
  } else {
    input = document.createElement('input');
    input.type = 'range';
    input.min = p.min ?? 0;
    input.max = p.max ?? 1;
    input.step = p.step ?? 0.01;
    input.value = fx.values[p.key];
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      fx.values[p.key] = v;
      out.textContent = formatValue(fx, p, v);
    });
  }
  row.appendChild(input);
  wrap.appendChild(row);
  return wrap;
}

function formatValue(fx, p, v){
  if (typeof p.format === 'string' && p.format[0] === '='){
    const scope = { ...fx.values, [p.key]: v };
    const result = evalFormat(p.format.slice(1), scope);
    if (result != null) return String(result);
  }
  return String(v) + (p.unit ? ' ' + p.unit : '');
}

function highlightShader(line){
  const cmtIdx = line.indexOf('//');
  let code = line, comment = '';
  if (cmtIdx >= 0){
    code = line.slice(0, cmtIdx);
    comment = line.slice(cmtIdx);
  }
  let out = escapeHtml(code)
    .replace(/\b(let|if|else|for|return)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(sample|rgb|rgba|hsv|sin|cos|tan|atan2|clamp|mix|lerp|floor|ceil|round|sqrt|abs|pow|min|max|mod|random|pi|smoothstep|step|sign|length|sampleA|sampleB|mixRGBA)\b/g,
             '<span class="fn">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  if (comment) out += `<span class="cmt">${escapeHtml(comment)}</span>`;
  return out;
}

registry.on('structure', () => {
  renderTabs(); renderList(); renderSettings(); renderChips(); updateEffectCount();
});
registry.on('state', () => {
  renderTabs();
  if (activeCat === 'active') renderList(); else updateCards();
  renderChips(); updateEffectCount();
});
registry.on('select', () => { updateCards(); renderSettings(); });

function updateEffectCount(){
  const n = registry.effects.filter(e => e.enabled && e._compiled).length;
  $('hudEffects').textContent = n + ' active';
}

/* ═══════════════════════════════════════════════════════════════
   6. VIDEO LOADING + TRANSPORT
   ═══════════════════════════════════════════════════════════════ */
let videoLoaded = false;

function loadVideoFile(file){
  if (!file || !file.type.startsWith('video/')) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  video.load();
  video.play().catch(()=>{});
  videoLoaded = true;
  placeholder.classList.add('hidden');
  video.addEventListener('loadedmetadata', () => {
    $('timeDur').textContent = fmtTime(video.duration);
    videoInfo = `${video.videoWidth}×${video.videoHeight}`;
    const chip = $('chipVideo');
    if (chip) chip.textContent = videoInfo;
    $('hudRes').textContent = `${canvas.width} × ${canvas.height}`;
  }, { once: true });
}

$('videoFile').addEventListener('change', e => {
  loadVideoFile(e.target.files[0]);
  e.target.value = '';
});

function fmtTime(s){
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2,'0');
}

const playBtn = $('playBtn');
const playIcon = $('playIcon');

playBtn.addEventListener('click', () => {
  if (!videoLoaded){ $('videoFile').click(); return; }
  if (video.paused) video.play().catch(()=>{});
  else video.pause();
});

video.addEventListener('play', () => {
  playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
});
video.addEventListener('pause', () => {
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
});

$('backBtn').addEventListener('click', () => {
  video.currentTime = Math.max(0, video.currentTime - 5);
});
$('fwdBtn').addEventListener('click', () => {
  video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
});

let seeking = false;
const seek = $('seek');
const timeCur = $('timeCur');

video.addEventListener('timeupdate', () => {
  if (seeking) return;
  if (video.duration) seek.value = (video.currentTime / video.duration) * 1000;
  timeCur.textContent = fmtTime(video.currentTime);
});
seek.addEventListener('input', () => {
  seeking = true;
  if (video.duration){
    video.currentTime = (seek.value / 1000) * video.duration;
    timeCur.textContent = fmtTime(video.currentTime);
  }
});
seek.addEventListener('change', () => { seeking = false; });

$('rateSel').addEventListener('change', e => {
  video.playbackRate = parseFloat(e.target.value);
});

/* ═══════════════════════════════════════════════════════════════
   7. PACK LOADING
   ═══════════════════════════════════════════════════════════════ */
$('packFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => loadPack(reader.result, f.name);
  reader.readAsText(f);
  e.target.value = '';
});

/* Drag & drop on stage */
['dragenter','dragover'].forEach(ev =>
  stage.addEventListener(ev, e => {
    e.preventDefault();
    stage.classList.add('dragover');
  })
);
['dragleave','drop'].forEach(ev =>
  stage.addEventListener(ev, e => {
    e.preventDefault();
    stage.classList.remove('dragover');
  })
);
stage.addEventListener('drop', e => {
  const files = e.dataTransfer.files;
  if (!files || !files.length) return;
  for (const f of files){
    if (f.type.startsWith('video/')){
      loadVideoFile(f);
    } else if (f.name.endsWith('.json') || f.type === 'application/json'){
      const reader = new FileReader();
      reader.onload = () => loadPack(reader.result, f.name);
      reader.readAsText(f);
    }
  }
});
placeholder.addEventListener('click', () => $('videoFile').click());

/* ═══════════════════════════════════════════════════════════════
   8. SNAPSHOT
   ═══════════════════════════════════════════════════════════════ */
$('snapBtn').addEventListener('click', () => {
  canvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'canvasfx-' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

/* ─── Demo scene shown before a video is loaded ─── */
function drawDemoScene(c, w, h, t){
  const g = c.createLinearGradient(0, 0, 0, h);
  const s = 0.5 + 0.5 * Math.sin(t * 0.3);
  g.addColorStop(0, `hsl(${222 - s * 20}, 55%, 22%)`);
  g.addColorStop(0.55, `hsl(${330 + s * 20}, 60%, 48%)`);
  g.addColorStop(1, `hsl(${28 + s * 10}, 85%, 62%)`);
  c.fillStyle = g; c.fillRect(0, 0, w, h);

  // sun
  const sx = w * 0.72, sy = h * 0.4 + Math.sin(t * 0.5) * 6;
  const sg = c.createRadialGradient(sx, sy, 4, sx, sy, h * 0.3);
  sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(0.25, 'rgba(255,214,120,.95)');
  sg.addColorStop(1, 'rgba(255,160,80,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, h * 0.3, 0, 7); c.fill();

  // mountains
  const ridge = (base, amp, col, ph) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w; x += 12) c.lineTo(x, base - Math.abs(Math.sin(x * 0.011 + ph)) * amp - Math.sin(x * 0.035 + ph) * amp * 0.15);
    c.lineTo(w, h); c.closePath(); c.fill();
  };
  ridge(h * 0.74, h * 0.2, '#2b1a3d', 1.3);
  ridge(h * 0.84, h * 0.14, '#140d22', 4.1);

  // moving balls
  const balls = [[0.22, 0.5, 38, 190, 1.0], [0.45, 0.62, 26, 50, 1.7], [0.6, 0.3, 20, 140, 2.3]];
  balls.forEach(([bx, by, r, hue, sp]) => {
    const x = w * bx + Math.sin(t * sp) * 40, y = h * by + Math.cos(t * sp * 1.3) * 22;
    const bg = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    bg.addColorStop(0, `hsl(${hue}, 90%, 80%)`); bg.addColorStop(1, `hsl(${hue}, 80%, 40%)`);
    c.fillStyle = bg; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  });

  // fine detail: thin grid + checker patch (shows scanlines, pixel, dither, sharpen…)
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1; c.beginPath();
  for (let x = 0; x < w; x += 24) { c.moveTo(x + .5, 0); c.lineTo(x + .5, h * 0.8); }
  for (let y = 0; y < h * 0.8; y += 24) { c.moveTo(0, y + .5); c.lineTo(w, y + .5); }
  c.stroke();
  for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) {
    c.fillStyle = (i + j) % 2 ? '#fff' : '#111'; c.fillRect(14 + i * 7, 14 + j * 7, 7, 7);
  }

  // colour bars
  const bars = ['#ffffff', '#ffe600', '#00e5ff', '#22c55e', '#ff2d95', '#ef4444', '#2563eb', '#000000'];
  const bw = w / bars.length, by0 = h * 0.88;
  bars.forEach((col, i) => { c.fillStyle = col; c.fillRect(i * bw, by0, bw + 1, h - by0); });

  c.fillStyle = 'rgba(255,255,255,.92)';
  c.font = '700 22px ui-sans-serif, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('CANVAS FX', w / 2, h * 0.14);
  c.font = '600 11px ui-sans-serif, sans-serif';
  c.fillText('demo scene — load a video to replace it', w / 2, h * 0.14 + 20);
}

/* ═══════════════════════════════════════════════════════════════
   9. RENDER LOOP
   ═══════════════════════════════════════════════════════════════ */
let frameCount = 0;
let lastFpsTime = performance.now();
let fpsFrames = 0;

/* Reusable ImageData for the output of each shader pass */
const outImageData = new ImageData(W, H);

function render(){
  requestAnimationFrame(render);

  const w = canvas.width, h = canvas.height;

  /* Draw the source frame (video or fallback gradient) */
  srcBufCtx.globalCompositeOperation = 'source-over';
  srcBufCtx.globalAlpha = 1;
  srcBufCtx.filter = 'none';
  srcBufCtx.clearRect(0, 0, w, h);

  if (videoLoaded && video.readyState >= 2 && video.videoWidth > 0){
    // Fit video into canvas, preserving aspect ratio (letterbox)
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.min(w / vw, h / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (w - dw) / 2, dy = (h - dh) / 2;
    srcBufCtx.drawImage(video, dx, dy, dw, dh);
  } else {
    // Built-in demo scene (not an effect): gives previews something with colour, edges,
    // fine detail and motion to act on until a video is loaded.
    drawDemoScene(srcBufCtx, w, h, performance.now() / 1000);
  }

  /* Ping-pong chain — start with the source in buf1 */
  buf1Ctx.globalCompositeOperation = 'source-over';
  buf1Ctx.globalAlpha = 1;
  buf1Ctx.filter = 'none';
  buf1Ctx.clearRect(0, 0, w, h);
  buf1Ctx.drawImage(srcBuf, 0, 0);

  let srcCanvas = buf1;
  let dstCanvas = buf2;
  const env = { w, h, time: performance.now() / 1000, frame: frameCount };

  for (const fx of registry.effects){
    if (!fx.enabled || !fx._compiled) continue;

    // Read input pixels
    const srcCtx = srcCanvas.getContext('2d');
    const inData = srcCtx.getImageData(0, 0, w, h);

    // Fresh output buffer (reused to reduce GC)
    const outData = new ImageData(w, h);

    try {
      fx._compiled(env, fx.values, inData, outData);
    } catch (e){
      console.warn('Shader runtime error in', fx.def.id, e);
      fx.enabled = false;
      registry.emit('state');
      continue;
    }

    const dstCtx = dstCanvas.getContext('2d');
    dstCtx.putImageData(outData, 0, 0);

    // Swap
    const tmp = srcCanvas; srcCanvas = dstCanvas; dstCanvas = tmp;
  }

  /* Present to the visible canvas */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(srcCanvas, 0, 0);

  drawCardPreviews(performance.now(), frameCount);

  /* FPS */
  fpsFrames++;
  const now = performance.now();
  if (now - lastFpsTime > 500){
    const fps = Math.round(fpsFrames * 1000 / (now - lastFpsTime));
    $('hudFps').textContent = fps + ' fps';
    lastFpsTime = now;
    fpsFrames = 0;
  }

  frameCount++;
}

/* ═══════════════════════════════════════════════════════════════
   10. TOAST
   ═══════════════════════════════════════════════════════════════ */
const toastEl = $('toast');
let toastTimer = null;
function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 3200);
}

/* ═══════════════════════════════════════════════════════════════
   11. BOOT
   ═══════════════════════════════════════════════════════════════ */
(function boot(){
  /* No bundled effects: the editor starts empty. Load a .json pack to add effects. */
  registry.emit();
  requestAnimationFrame(render);
})();

$('allOff').addEventListener('click', () => {
  registry.effects.forEach(fx => { fx.enabled = false; });
  registry.emit('state');
});

/* Keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){
    e.preventDefault();
    playBtn.click();
  }
});

})();
